<!--
  EO Solução & Criação — Sistema de Gestão de Agendamentos PRO
  Marca branca / Multirrubro / v7.2 PRO (pt-BR)
  index.html — ARQUIVO ÚNICO: app interna + portal de agendamento público

  Arquitetura:
  - Frontend único (este arquivo) + backend Google Apps Script exposto em /api/gas
  - Modo admin: login → Dashboard, Agenda, Clientes, Alertas, Profissionais,
    Solicitações, Configurações e Relatórios
  - Modo público: index.html?booking=1 → portal de agendamento (srcdoc a partir de #bookingTpl)
  - Sincronização delta por etags + cache local (localStorage)
  - Telegram opcional: avisos em tempo real (solicitações, pagamentos, mudanças de status)

  NOVO em v7.2:
  - Interface 100% em português do Brasil (textos, datas, valores e mensagens)
  - Tema oficial verde · preto · branco (identidade EO Solução & Criação)
  - Design elegante e profissional (tipografia Sora + Inter, cartões, modais e badges renovados)
  - Responsividade refinada para todos os tamanhos de tela
  - Status exibidos em pt-BR com compatibilidade total dos dados existentes (tpal())
  v7.1: portal como template legível (#bookingTpl), gsRun() com timeout, correções de bugs
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>EO Solução & Criação — Gestão de Agendamentos PRO v7.2</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EO Agendamentos">
  <link id="pwaManifest" rel="manifest" href="/api/gas?asset=manifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/api/gas?asset=icon-192">
  <link rel="apple-touch-icon" sizes="180x180" href="/api/gas?asset=icon-180">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');

/* ═════════════════════════════════════════════════════════════
   EO Solução & Criação — Tema oficial v7.2
   Paleta: verde · preto · branco — elegante e profissional
   ═════════════════════════════════════════════════════════════ */
:root{
  --navy:#0b110e; --navy2:#101815; --navys:#16211c;
  --verde:#16a34a; --verde-esc:#0f7a38; --accent:#34d399;
  --bg:#f3f6f4; --card:#ffffff; --muted:#64746b;
  --line:#e1e8e3; --ok:#bff3d2; --warn:#ffe3ad; --danger:#ffcdd6;
  --text:#111814; --shadow:0 18px 44px rgba(7,28,17,.08);
  --r:18px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#c6d4cb transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-thumb{background:#c6d4cb;border-radius:99px;}
*::-webkit-scrollbar-thumb:hover{background:#8fd4ae;}
::selection{background:rgba(52,211,153,.32);}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Sora','Inter',system-ui,sans-serif;letter-spacing:-.3px;}
.hidden{display:none!important;}

/* ── SHELL ─────────────────────────────── */
#app{display:grid;grid-template-columns:276px 1fr;min-height:100vh;}

/* ── SIDEBAR (preto elegante + verde) ──── */
.sidebar{
  background:linear-gradient(178deg,#0a0f0c,#0d1512 55%,#111d17);
  color:#fff;padding:24px 16px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.brand-logo{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--verde));
  display:grid;place-items:center;color:#03180c;
  font-weight:900;font-size:15px;overflow:hidden;font-family:'Sora',sans-serif;
  box-shadow:0 10px 26px rgba(22,163,74,.38);
}
.brand-title{font-weight:800;line-height:1.15;font-size:15px;}
.brand-sub{color:#8ba698;font-size:11px;margin-top:2px;letter-spacing:.2px;}
.nav-btn{
  width:100%;border:0;background:transparent;color:#aebfb5;
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  border-radius:13px;margin-bottom:4px;text-align:left;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.16s;position:relative;
}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-btn.active{
  background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(22,163,74,.10));
  color:#8ce8bb;font-weight:700;
}
.nav-btn.active::before{
  content:'';position:absolute;left:0;top:24%;bottom:24%;width:3.5px;
  border-radius:99px;background:linear-gradient(180deg,var(--accent),var(--verde));
}
.nav-btn .nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
.sidebar-user{
  margin-top:auto;padding:15px;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
}
.sidebar-user strong{font-size:14px;}
.sidebar-user .role-badge{
  font-size:10.5px;color:#7ee2b8;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  background:rgba(52,211,153,.14);padding:3px 9px;border-radius:99px;
  display:inline-block;margin-top:5px;
}

/* ── MAIN ──────────────────────────────── */
.main{padding:26px;min-width:0;}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;margin-bottom:24px;flex-wrap:wrap;
}
.page-title h1{font-size:25px;margin:0;color:var(--navy);font-weight:800;letter-spacing:-.4px;}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px;}

.search-wrap{position:relative;}
.search-box{
  display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--line);padding:9px 14px;
  border-radius:999px;min-width:270px;
  box-shadow:0 6px 18px rgba(7,28,17,.05);transition:.16s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(52,211,153,.14);}
.search-box input{border:0;outline:none;width:100%;background:transparent;font-size:13px;}
.search-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);max-height:260px;overflow-y:auto;
}
.search-dropdown-item{
  padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);
  transition:background .1s;
}
.search-dropdown-item:last-child{border-bottom:0;}
.search-dropdown-item:hover{background:#f2faf5;}
.search-dropdown-item strong{display:block;color:var(--navy);}
.search-dropdown-item span{color:var(--muted);font-size:12px;}

/* ── CARDS ─────────────────────────────── */
.card-soft{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}

/* ── KPI GRID ──────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px;}
.kpi{padding:20px;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(7,28,17,.12);}
.kpi small{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;}
.kpi strong{display:block;color:var(--navy);font-size:27px;font-weight:800;margin-top:8px;line-height:1;letter-spacing:-.5px;font-family:'Sora','Inter',sans-serif;}
.kpi-icon{width:40px;height:40px;border-radius:13px;background:rgba(22,163,74,.1);
  display:grid;place-items:center;font-size:19px;margin-bottom:10px;}

/* ── AGENDAMENTO MINI ──────────────────── */
.section-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;}
.panel{padding:20px;}
.panel h3{color:var(--navy);font-weight:800;font-size:17px;margin-bottom:14px;}
.turno-mini{
  display:grid;grid-template-columns:60px 1fr auto;
  gap:10px;padding:12px;border-radius:14px;
  border:1px solid var(--line);margin-bottom:8px;
  background:#fff;cursor:pointer;transition:box-shadow .15s,border-color .15s;
}
.turno-mini:hover{box-shadow:0 6px 18px rgba(7,28,17,.09);border-color:#b9e6cc;}
.time-pill{
  background:rgba(22,163,74,.09);color:#0b6b33;font-weight:800;
  padding:7px 6px;border-radius:10px;text-align:center;font-size:13px;
  align-self:start;line-height:1.2;
}

/* ── STATUS BADGES ─────────────────────── */
.status{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;border:1px solid transparent;}
.st-Pendiente{background:#fff5df;color:#8f5e0a;border-color:#f2e3b5;}
.st-Confirmado{background:#e7f9ef;color:#0b6b33;border-color:#bce8cf;}
.st-Realizado{background:var(--verde);color:#fff;border-color:var(--verde);}
.st-Cancelado{background:#ffe9ee;color:#b3274a;border-color:#f8c9d3;}
.st-Reprogramado{background:#eef2ff;color:#4353b8;border-color:#d6ddf9;}
.st-Ausente{background:#f0f3f1;color:#5a6a61;border-color:#dde4df;}
.st-PagoEnviado{background:#eef6ff;color:#1e4f8f;border-color:#cfe4fa;}
.st-Pagado{background:#0b110e;color:#7ee2b8;border-color:#0b110e;}

/* ── BOTÕES ────────────────────────────── */
.btn-navy{background:linear-gradient(135deg,var(--verde),var(--verde-esc));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;box-shadow:0 10px 24px rgba(22,163,74,.22);}
.btn-navy:hover{background:linear-gradient(135deg,#128a40,#0b6330);color:#fff;transform:translateY(-1px);box-shadow:0 14px 30px rgba(22,163,74,.32);}
.btn-soft{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 15px;font-weight:600;color:var(--navy);font-size:13px;cursor:pointer;transition:.16s;}
.btn-soft:hover{background:#f2faf5;border-color:#c4dccd;}
.btn-icon{border:0;background:rgba(22,163,74,.09);color:#0b6b33;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;transition:.16s;}
.btn-icon:hover{background:rgba(22,163,74,.18);}
.btn-danger{border:0;background:#ffeef1;color:#b3274a;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;transition:.16s;}
.btn-danger:hover{background:#ffdde4;}
.btn-navy:focus-visible,.btn-soft:focus-visible,.btn-icon:focus-visible,.nav-btn:focus-visible,.fab:focus-visible{outline:3px solid rgba(52,211,153,.5);outline-offset:2px;}
.fab{
  position:fixed;right:26px;bottom:26px;width:60px;height:60px;
  border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--verde));
  color:#fff;border:0;box-shadow:0 18px 40px rgba(22,163,74,.42);
  font-size:28px;font-weight:300;z-index:40;cursor:pointer;transition:.18s;
}
.fab:hover{transform:scale(1.06) translateY(-1px);}

/* ── AGENDA ────────────────────────────── */
.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.date-nav{display:flex;gap:8px;align-items:center;}
.date-nav input{border:1px solid var(--line);border-radius:12px;padding:9px;font-weight:700;font-size:13px;outline:none;background:#fff;color:var(--text);}
.date-nav input:focus{border-color:var(--accent);}
.agenda-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;}
.agenda-grid{display:grid;min-width:fit-content;}
.ag-head,.ag-hour,.ag-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
.ag-head{
  background:var(--navy);color:#fff;font-weight:800;font-size:12px;
  padding:12px 14px;position:sticky;top:0;z-index:3;
}
.ag-hour{
  background:#f6faf7;color:var(--muted);font-weight:800;font-size:12px;
  text-align:center;padding:0 6px;display:flex;align-items:center;justify-content:center;
  min-height:60px;
}
.ag-cell{min-height:60px;padding:4px;transition:background .1s;}
.ag-cell:hover{background:#f4faf6;}
.appt{
  border-radius:10px;padding:7px 9px;font-size:12px;cursor:pointer;
  border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 8px rgba(7,28,17,.06);
  margin-bottom:3px;transition:transform .12s;
}
.appt:hover{transform:translateX(2px);}
.appt strong{display:block;color:var(--navy);font-size:12px;}
.mobile-list{display:none;}

/* ── CLIENTES ──────────────────────────── */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.client-card{padding:16px;transition:transform .16s,box-shadow .16s;}
.client-card:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(7,28,17,.12);}
.client-card h4{font-size:15px;color:var(--navy);font-weight:800;margin:0 0 6px;}

/* ── CONFIG ────────────────────────────── */
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.config-card{padding:20px;}
.config-card h4{font-size:15px;color:var(--navy);font-weight:800;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid rgba(22,163,74,.18);}

/* ── FORMS ─────────────────────────────── */
.form-control,.form-select{border-radius:11px;border-color:var(--line);padding:9px 12px;font-size:13px;color:var(--text);background:#fff;}
.form-control:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(52,211,153,.14);outline:0;}
.form-label{font-weight:700;color:var(--navy);font-size:11.5px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}

/* ── MODAL ─────────────────────────────── */
.modalx-backdrop{
  position:fixed;inset:0;background:rgba(5,10,8,.6);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:100;padding:16px;
  animation:fadein .16s;
}
.modalx{
  background:#fff;width:min(720px,100%);max-height:92vh;
  overflow:auto;border-radius:22px;
  box-shadow:0 40px 100px rgba(0,0,0,.32);
  animation:pop .16s ease-out;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:scale(1);opacity:1}}
.modalx-header{
  background:linear-gradient(135deg,#0b110e,#152119);color:#fff;padding:18px 22px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:2;border-bottom:3px solid var(--verde);
}
.modalx-header h3{margin:0;font-size:17px;font-weight:800;}
.modalx-close{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;transition:.15s;}
.modalx-close:hover{background:var(--verde);}
.modalx-body{padding:22px;}

/* ── TOAST ─────────────────────────────── */
#toastRoot{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toastx{
  background:#fff;color:var(--navy);border-left:5px solid var(--accent);
  box-shadow:var(--shadow);padding:12px 16px;border-radius:14px;
  max-width:320px;font-weight:700;font-size:13px;pointer-events:all;
  animation:slideIn .2s ease-out;
}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}

/* ── AUTOCOMPLETE DE CLIENTE NO MODAL ──── */
.client-ac-wrap{position:relative;}
.client-ac-list{
  position:absolute;top:100%;left:0;right:0;z-index:99;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);max-height:200px;overflow-y:auto;margin-top:4px;
}
.client-ac-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;}
.client-ac-item:last-child{border-bottom:0;}
.client-ac-item:hover{background:#f2faf5;}
.client-ac-item b{color:var(--navy);}
.client-ac-item span{color:var(--muted);font-size:11px;}

/* ── LOGIN (preto + verde) ─────────────── */
.login-screen{
  min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:
    radial-gradient(900px 480px at 12% -8%,rgba(52,211,153,.17),transparent 55%),
    radial-gradient(760px 420px at 92% 108%,rgba(16,185,129,.14),transparent 55%),
    linear-gradient(160deg,#070b09,#0c1410 55%,#0a0f0d);
}
.login-card{
  width:min(430px,100%);background:rgba(255,255,255,.98);
  border-radius:26px;padding:34px;
  box-shadow:0 40px 100px rgba(0,0,0,.5);
}
.login-card h1{color:var(--navy);font-weight:800;font-size:26px;margin-bottom:4px;}
.login-card p{color:var(--muted);margin-bottom:24px;font-size:14px;}
.login-footer{margin-top:24px;font-size:11px;color:var(--muted);text-align:center;}

/* ── TABELAS ───────────────────────────── */
.table-soft{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);}
.table-soft table{margin:0;}
.table-soft th{color:var(--navy);background:#f2f7f4;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
.table-soft td{font-size:13px;}

/* ── SOLICITAÇÕES ──────────────────────── */
.sol-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);
  border-left:4px solid var(--accent);
}
.sol-card.Nueva      { border-left-color:#f0b429; }
.sol-card.Contactada { border-left-color:#34d399; }
.sol-card.Confirmada { border-left-color:var(--verde-esc); }
.sol-card.Cancelada  { border-left-color:#f381a0; opacity:.75; }
.sol-estado {
  display:inline-flex;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;
}
.sol-Nueva      { background:#fff5df;color:#8f5e0a; }
.sol-Contactada { background:#e7f9ef;color:#0b6b33; }
.sol-Confirmada { background:#0b110e;color:#7ee2b8; }
.sol-Cancelada  { background:#ffe9ee;color:#b3274a; }
.sol-servicios-tag {
  display:inline-block;background:#eef7f1;color:#1c4a30;
  border:1px solid #d5e8dc;border-radius:8px;padding:2px 9px;
  font-size:11px;font-weight:600;margin:2px 2px 0 0;
}
.pago-metodo-row {
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:#f7faf8;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
}
.pago-metodo-icon { font-size:20px; flex-shrink:0; }
.pago-metodo-label { font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px; }
.pago-metodo-val { font-size:13px;font-weight:700;color:var(--navy);word-break:break-all; }

/* ── MENU MOBILE ────────────────────────── */
.mobile-appbar,.menu-backdrop{display:none;}

/* ── RESPONSIVO ────────────────────────── */
@media(max-width:980px){
  #app{grid-template-columns:1fr;}
  .sidebar{
    display:flex;position:fixed;left:0;top:0;bottom:0;
    width:min(86vw,320px);z-index:120;
    transform:translateX(-105%);transition:transform .24s ease;
    padding-top:max(22px,env(safe-area-inset-top));
    padding-bottom:max(22px,env(safe-area-inset-bottom));
    box-shadow:24px 0 60px rgba(0,0,0,.35);
  }
  .sidebar.mobile-open{transform:translateX(0);}
  .menu-backdrop{
    position:fixed;inset:0;background:rgba(4,10,7,.55);
    backdrop-filter:blur(2px);z-index:110;
  }
  #app.mobile-menu-open .menu-backdrop{display:block;}
  .mobile-appbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:45;
    margin:-18px -16px 16px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;
    background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
  }
  .mobile-menu-toggle{
    width:44px;height:44px;border:0;border-radius:12px;background:var(--navy);
    color:#fff;font-size:23px;line-height:1;display:grid;place-items:center;
  }
  .mobile-menu-toggle:active{background:var(--verde-esc);}
  .mobile-app-title{min-width:0;flex:1;}
  .mobile-app-title strong{display:block;color:var(--navy);font-size:14px;}
  .mobile-app-title span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .main{padding:16px 14px max(24px,env(safe-area-inset-bottom));min-width:0;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .section-grid{grid-template-columns:1fr;}
  .agenda-wrap{display:none;}
  .mobile-list{display:block;}

<!-- ═══ PORTAL DE RESERVAS PÚBLICO — plantilla legible dentro del mismo archivo ═══

<!DOCTYPE html>
<\!--
  EO Solução & Criação — Portal de reservas público
  booking v7.1 PRO (embebido en index.html)
  Flujo: DNI → Sucursal → Profesional → Servicio → Horario real → Solicitud
-->
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Agendar horário</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap');
/* EO Solução & Criação — Portal de agendamento (tema verde · preto · branco) */
:root{
  --n:#0b110e;--n2:#12241a;--ac:#2fbf71;--ac2:#0f7a38;
  --bg:#f3f6f4;--card:#fff;--tx:#111814;--mu:#64746b;
  --li:#e1e8e3;--ok:#bff3d2;--wn:#ffe3ad;
  --sh:0 12px 34px rgba(7,28,17,.09);--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--tx);
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;}
.hdr{background:linear-gradient(135deg,#0a0f0c 0%,#0f2a1c 55%,#105c33 100%);color:#fff;padding:22px 16px;
  border-bottom:3px solid var(--ac);}
.hdr-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.hdr-logo{width:48px;height:48px;border-radius:14px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#03180c;font-family:'Sora',sans-serif;
  box-shadow:0 10px 24px rgba(0,0,0,.35);}
.hdr-logo img{width:100%;height:100%;object-fit:cover;border-radius:14px;}
.hdr h1{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;letter-spacing:-.2px;}
.hdr p{font-size:11px;opacity:.75;margin-top:2px;}

/* STEPPER */
.stepper{max-width:600px;margin:0 auto;padding:14px 20px 0;
  display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--li);}
.sdot{width:28px;height:28px;border-radius:50%;background:var(--li);
  color:var(--mu);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--li);transition:.25s;flex-shrink:0;}
.sdot.on,.sdot.done{background:var(--ac2);color:#fff;border-color:var(--ac2);}
.sdot.done{background:var(--ac);border-color:var(--ac);}
.sline{flex:1;height:2px;background:var(--li);transition:.25s;}
.sline.done{background:var(--ac);}
.slbls{max-width:600px;margin:0 auto;padding:6px 20px 14px;
  display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid var(--li);}
.slbl{font-size:10px;color:var(--mu);font-weight:600;text-align:center;flex:1;}
.slbl.on,.slbl.done{color:var(--ac2);}

/* CONTEÚDO */
.ct{max-width:600px;margin:0 auto;padding:18px 14px 70px;}
.pnl{background:var(--card);border:1px solid var(--li);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px;margin-bottom:14px;}
.ptitle{font-size:14px;font-weight:800;color:var(--n);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;font-family:'Sora','Inter',sans-serif;}

/* FORMULÁRIOS */
.fi{margin-bottom:12px;}
label{display:block;font-size:10px;font-weight:700;color:var(--mu);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
input,select,textarea{
  width:100%;border:1.5px solid var(--li);border-radius:10px;
  padding:10px 13px;font-size:14px;color:var(--tx);
  font-family:inherit;outline:none;background:#fff;transition:border-color .15s;
  -webkit-appearance:none;}
input:focus,select:focus,textarea:focus{
  border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,191,113,.18);}
.irow{display:flex;gap:10px;}.irow>*{flex:1;}

/* BOTÕES */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:11px;padding:11px 18px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-p{background:linear-gradient(135deg,#1cb35a,#0f7a38);color:#fff;width:100%;
  box-shadow:0 10px 22px rgba(22,163,74,.26);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(22,163,74,.34);}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-o{background:#fff;border:1.5px solid var(--li);color:var(--n);}
.btn-o:hover{border-color:var(--ac2);color:var(--ac2);}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 4px 14px rgba(37,211,102,.3);}
.nav-bk{background:none;border:none;color:var(--mu);font-size:12px;font-weight:700;
  cursor:pointer;padding:0;margin-bottom:12px;font-family:inherit;
  display:flex;align-items:center;gap:4px;}
.nav-bk:hover{color:var(--ac2);}

/* CARTÕES DE SELEÇÃO */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:360px){.sg{grid-template-columns:1fr;}}
.sc{border:2px solid var(--li);border-radius:13px;padding:13px;cursor:pointer;
  transition:all .15s;background:#fff;user-select:none;position:relative;}
.sc:hover{border-color:#7fdcaa;}
.sc.sel{border-color:var(--ac2);background:#e9f9f1;}
.sc-t{font-size:13px;font-weight:700;color:var(--n);}
.sc-s{font-size:11px;color:var(--mu);margin-top:2px;}
.sc-ck{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;
  background:var(--li);display:flex;align-items:center;justify-content:center;
  font-size:10px;transition:.15s;}
.sc.sel .sc-ck{background:var(--ac2);color:#fff;}

/* HORÁRIOS */
.slots-row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;}
.slot{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;
  background:#e9f9f1;color:#0b5c2e;border:1.5px solid #8fe0b4;
  cursor:pointer;transition:all .15s;white-space:nowrap;}
.slot:hover{background:#d2f4e0;}
.slot.sel{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(22,163,74,.3);}
.sem-lbl{font-size:10px;font-weight:800;color:var(--mu);text-transform:uppercase;
  letter-spacing:.5px;padding:10px 0 6px;border-top:1px solid var(--li);margin-top:4px;}
.sem-lbl:first-child{border-top:none;padding-top:0;}
.day-row{margin-bottom:8px;}
.day-name{font-size:12px;font-weight:800;color:var(--n);margin-bottom:5px;}
.no-sl{color:var(--mu);font-size:12px;padding:8px 0;}

/* SERVIÇOS */
.svc-i{display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:2px solid var(--li);border-radius:12px;cursor:pointer;
  transition:all .15s;margin-bottom:7px;background:#fff;user-select:none;}
.svc-i:hover{border-color:#7fdcaa;}
.svc-i.sel{border-color:var(--ac2);background:#e9f9f1;}
.svc-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.svc-nm{font-size:13px;font-weight:700;color:var(--n);flex:1;}
.svc-mt{font-size:11px;color:var(--mu);}
.svc-pr{font-size:12px;font-weight:800;color:var(--n);white-space:nowrap;}
.svc-ck{font-size:16px;color:var(--mu);}
.svc-i.sel .svc-ck{color:var(--ac2);}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;
  background:#e9f9f1;border:1px solid #bfe9d1;border-radius:7px;
  padding:4px 9px;font-size:11px;font-weight:600;color:#0b5c2e;margin:2px;}
.chip button{background:none;border:none;color:#d1435b;cursor:pointer;
  font-size:12px;line-height:1;padding:0;}

/* RESUMO */
.rs-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid var(--li);font-size:12px;}
.rs-row:last-child{border-bottom:0;}
.rs-lbl{color:var(--mu);font-weight:600;min-width:80px;}
.rs-val{font-weight:700;color:var(--n);text-align:right;}
.tot-box{display:flex;justify-content:space-between;align-items:center;
  background:#e9f9f1;border:1px solid #bfe9d1;border-radius:12px;
  padding:12px 14px;margin-top:12px;}
.tot-box span{font-size:12px;color:var(--mu);}
.tot-box strong{font-size:20px;font-weight:800;color:var(--n);font-family:'Sora','Inter',sans-serif;}

/* SUCESSO */
.succ{text-align:center;padding:28px 10px;}
.succ-ic{width:66px;height:66px;border-radius:50%;background:#d9f6e5;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 16px;}
.succ h2{font-size:20px;font-weight:800;color:var(--n);}
.succ p{color:var(--mu);font-size:13px;margin-top:8px;line-height:1.6;}
.tag{display:inline-block;background:#e9f9f1;color:#0b5c2e;
  border:1px solid #bfe9d1;border-radius:7px;padding:2px 9px;
  font-size:11px;font-weight:600;margin:2px;}

/* OVERLAY & TOAST */
.ov{position:fixed;inset:0;background:rgba(6,12,9,.55);
  display:none;place-items:center;z-index:200;}
.ov.show{display:grid;}
.sp{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--n);color:#fff;padding:10px 18px;border-radius:11px;
  font-size:12px;font-weight:700;z-index:300;max-width:320px;text-align:center;
  transition:.25s;opacity:0;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.err{background:#7f1d1d;}
.divv{height:1px;background:var(--li);margin:12px 0;}
.ok-box{background:#f2fbf6;border:1.5px solid #bfe9d1;border-radius:12px;padding:13px 14px;margin-top:8px;}
  </style>
</head>
<body>
<div class="ov" id="ov"><div class="sp"></div></div>
<div id="toast"></div>

<\!-- HEADER -->
<div class="hdr">
  <div class="hdr-in">
    <div class="hdr-logo" id="hLogo">EO</div>
    <div>
      <h1 id="hTitle">Agendar horário</h1>
      <p id="hSub">Portal de agendamento online</p>

</div>

<\!-- STEPPER -->
<div style="background:#fff;border-bottom:1px solid var(--li);">
  <div class="stepper">
    <div class="sdot on" id="d1">1</div>
    <div class="sline" id="l12"></div>
    <div class="sdot" id="d2">2</div>
    <div class="sline" id="l23"></div>
    <div class="sdot" id="d3">3</div>
    <div class="sline" id="l34"></div>
    <div class="sdot" id="d4">4</div>
  </div>
  <div class="slbls">
    <span class="slbl on" id="lb1">Minha conta</span>

</div>

<div class="ct">

  <\!-- P1: DNI -->
  <div id="p1">
    <div class="pnl">
      <div class="ptitle">🪪 Informe seu CPF</div>
      <p style="font-size:12px;color:var(--mu);margin-bottom:14px;">Se você já agendou antes, vamos te encontrar automaticamente.</p>
      <div class="fi">
        <label>CPF (somente números)</label>

          <input type="tel" id="dniI" placeholder="00011122233" inputmode="numeric" maxlength="11"
            oninput="this.value=this.value.replace(/[^\d]/g,'')"

          <button class="btn btn-p" style="width:auto;padding:10px 18px;" onclick="buscarDni()">Buscar</button>
        </div>
      </div>
      <\!-- Encontrado -->
      <div id="cliOk" style="display:none;" class="ok-box">
        <div style="font-size:12px;font-weight:700;color:#065f46;">✅ Encontramos você!</div>
        <div style="font-size:15px;font-weight:800;color:var(--n);margin-top:4px;" id="cliNomOk"></div>
        <div style="font-size:12px;color:var(--mu);margin-top:2px;" id="cliTelOk"></div>
        <button class="btn btn-p" style="margin-top:12px;" onclick="paso2()">Continuar →</button>
      </div>
      <\!-- Nuevo -->
      <div id="cliNew" style="display:none;margin-top:12px;">
        <div class="divv"></div>
        <div style="font-size:13px;font-weight:700;color:var(--n);margin-bottom:10px;">👋 Primeira vez? Complete seus dados:</div>
        <div class="fi"><label>Nome completo *</label><input type="text" id="nNom" autocomplete="name" placeholder="João Silva"></div>
        <div class="irow">
          <div class="fi"><label>WhatsApp *</label><input type="tel" id="nTel" placeholder="(11) 90000-0000"></div>
          <div class="fi"><label>Email</label><input type="email" id="nEmail" autocomplete="email" placeholder="joao@email.com"></div>
        </div>
        <button class="btn btn-p" onclick="crearCli()">Continuar →</button>
      </div>
    </div>
  </div>

  <\!-- P2: SUCURSAL + PROFESIONAL -->
  <div id="p2" style="display:none;">
    <button class="nav-bk" onclick="paso1()">← Volver</button>
    <div class="pnl">
      <div class="ptitle">📍 Escolha a unidade</div>
      <div class="sg" id="sucG"></div>
    </div>
    <div class="pnl" id="profP" style="display:none;">
      <div class="ptitle">👤 Escolha o profissional</div>
      <div class="sg" id="profG"></div>
      <button class="btn btn-p" style="margin-top:12px;" id="btnP3" onclick="paso3()" disabled>Escolher serviço →</button>
    </div>
  </div>

  <\!-- P3: SERVICIO -->
  <div id="p3" style="display:none;">
    <button class="nav-bk" onclick="paso2()">← Volver</button>
    <div class="pnl">

      <p style="font-size:12px;color:var(--mu);margin-bottom:12px;">Primeiro escolha o serviço para calcularmos os horários reais de acordo com a duração. Assim evitamos sobreposições.</p>
      <div id="svcG"></div>
      <button class="btn btn-p" style="margin-top:12px;" id="btnP4" onclick="paso4()" disabled>Ver horários disponíveis →</button>

  <\!-- P4: HORARIOS + CONFIRMAR -->
  <div id="p4" style="display:none;">

      <p style="font-size:12px;color:var(--mu);margin-bottom:12px;">Os horários são calculados com a duração real de <strong id="svcSelName">seu serviço</strong>.</p>
      <div id="calW"><div style="text-align:center;color:var(--mu);padding:20px 0;">Consultando disponibilidade...</div></div>
      <div id="slotsSelW" style="display:none;margin-top:10px;">
        <div class="divv"></div>
        <div style="font-size:10px;font-weight:700;color:var(--mu);margin-bottom:6px;">SELECIONADOS:</div>

          📲 Falar com a empresa no WhatsApp
        </a>
        <div style="margin-top:20px;">

  </div>

</div><\!-- /ct -->

<script>
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const API_URL="/api/gas";
const B={pub:null,cli:null,suc:null,prof:null,svc:null,slots:[],sEleg:[],sid:null,_dni:''};

// Compatibilidad dual: HtmlService usa google.script.run; Vercel usa /api/gas.
if (!window.google?.script?.run) {
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', {
    get() {
      const state={ok:()=>{},fail:()=>{}};
      let runner;
      runner = new Proxy({}, {
        get(_target, prop) {
          if (prop==='withSuccessHandler') return fn=>(state.ok=fn, runner);
          if (prop==='withFailureHandler') return fn=>(state.fail=fn, runner);
          return (...args)=>fetch(API_URL,{
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify({action:String(prop),args})
          })
            .then(r=>r.ok?r.json():Promise.reject(new Error('Error HTTP '+r.status)))
            .then(state.ok)
            .catch(state.fail);
        }
      });
      return runner;
    }
  });
}

addEventListener('DOMContentLoaded',()=>{
  B.sid=Math.random().toString(36).slice(2);
  ov(true);
  google.script.run
    .withSuccessHandler(r=>{ov(false);if(!r.ok){tk('Erro ao carregar','err');return;}B.pub=r.data;brand();})
    .withFailureHandler(()=>{ov(false);tk('Erro de conexão','err');})
    .apiGetPublicData();
});

function brand(){
  const d=B.pub;
  document.title='Agendar em '+d.empresa;
  const l=el('hLogo');
  if(d.logo)l.innerHTML=`<img src="${e(d.logo)}">`;else l.textContent=d.iniciales||'EO';
  el('hTitle').textContent=d.empresa;
  el('hSub').textContent=d.sistema||'Agendamento online';
}

/* ─── P1: DNI ─────────────────────────── */
function buscarDni(){
  const dni=el('dniI').value.trim();
  if(!dni||dni.length<6){tk('CPF inválido');return;}
  B._dni=dni;
  ov(true);
  google.script.run
    .withSuccessHandler(r=>{
      ov(false);
      if(!r.ok){tk(r.message,'err');return;}
      if(r.data.exists){
        B.cli={id:r.data.id,nombre:r.data.nombre,telefono:r.data.telefono,email:r.data.email};
        el('cliNomOk').textContent='👋 '+r.data.nombre;
        el('cliTelOk').textContent='📞 '+(r.data.telefono||'');
        sh('cliOk');hd('cliNew');
      }else{hd('cliOk');sh('cliNew');}
    })
    .withFailureHandler(()=>{ov(false);tk('Erro de conexão','err');})
    .apiBookingLookupDni(dni);
}

function crearCli(){
  const nom=el('nNom').value.trim(),tel=el('nTel').value.trim(),eml=el('nEmail').value.trim();
  if(!nom){tk('Preencha seu nome');return;}
  if(!tel){tk('Preencha seu telefone');return;}
  ov(true);
  google.script.run
    .withSuccessHandler(r=>{
      ov(false);
      if(!r.ok){tk(r.message,'err');return;}
      B.cli={id:r.data.id,nombre:r.data.nombre,telefono:r.data.telefono||tel,email:r.data.email||eml};
      paso2();
    })
    .withFailureHandler(()=>{ov(false);tk('Erro ao salvar','err');})
    .apiBookingUpsertCliente({dni_cuit:B._dni,nombre:nom,telefono:tel,email:eml});
}

/* ─── P2: SUCURSAL + PROF ────────────── */
function paso1(){gt('p1',1);}
function paso2(){
  rSuc();
  hd('profP');
  B.suc=null;B.prof=null;
  gt('p2',2);
}

function rSuc(){
  el('sucG').innerHTML=(B.pub.sucursales||[]).map(s=>`
    <div class="sc${B.suc?.id===s.id?' sel':''}" onclick="elSuc('${s.id}')">
      <div class="sc-ck">${B.suc?.id===s.id?'✓':''}</div>
      <div class="sc-t">${e(s.nombre)}</div>
      <div class="sc-s">${e(s.direccion||'')}</div>
      ${s.telefono?`<div class="sc-s">📞 ${e(s.telefono)}</div>`:''}
    </div>`).join('');
}

function elSuc(id){
  B.suc  = B.pub.sucursales.find(s=>s.id===id);
  B.prof = null;
  rSuc();
  rProfs();
  sh('profP');
  el('btnP3').disabled = true;
}

// Renderiza el grid de profesionales según B.suc y B.prof actuales
function rProfs(){
  const sucId = B.suc?.id;
  const profs = (B.pub.profesionales||[]).filter(p=>p.sucursal_id===sucId);
  el('profG').innerHTML = profs.length
    ? profs.map(p=>`
        <div class="sc${B.prof?.id===p.id?' sel':''}" onclick="elProf('${p.id}')">
          <div class="sc-ck">${B.prof?.id===p.id?'✓':''}</div>
          <div class="sc-t">${e(p.nombre)}</div>
          <div class="sc-s">${e(p.especialidad||'')}</div>
        </div>`).join('')
    : `<p style="font-size:12px;color:var(--mu);">Nenhum profissional nesta unidade.</p>`;
}

function elProf(id){
  B.prof = B.pub.profesionales.find(p=>p.id===id);
  rProfs();                          // re-render SIN tocar B.prof
  el('btnP3').disabled = false;
}

/* ─── P3: SERVICIO ──────────────────── */
function paso3(){
  if(!B.prof){tk('Escolha um profissional');return;}
  B.svc=null;B.slots=[];B.sEleg=[];
  gt('p3',3);rServicios();
}

function rServicios(){
  const svcs=B.pub.servicios||[],mon=B.pub.moneda||'$';
  const box=el('svcG');
  box.innerHTML=svcs.length?svcs.map(s=>`
    <div class="svc-i${B.svc?.id===s.id?' sel':''}" onclick="elServicio('${s.id}')">
      <div class="svc-dot" style="background:${e(s.color_hex||'#2fbf71')};"></div>
      <div style="flex:1;"><div class="svc-nm">${e(s.nombre)}</div><div class="svc-mt">${s.duracion_min} min</div></div>
      <div class="svc-pr">${mon} ${Number(s.precio||0).toLocaleString('pt-BR')}</div>
      <div class="svc-ck">${B.svc?.id===s.id?'●':'○'}</div>
    </div>`).join(''):'<div class="no-sl">Nenhum serviço ativo cadastrado.</div>';
  el('btnP4').disabled=!B.svc;
}

function elServicio(id){
  B.svc=(B.pub.servicios||[]).find(s=>s.id===id);
  B.sEleg=[];B.slots=[];
  rServicios();
}

/* ─── P4: SLOTS + CONFIRMACIÓN ───────── */
function paso4(){
  if(!B.svc){tk('Escolha um serviço');return;}
  B.sEleg=[];
  gt('p4',4);
  el('svcSelName').textContent=B.svc.nombre||'tu servicio';
  cargarSlots();
}

function cargarSlots(){
  el('calW').innerHTML='<div style="text-align:center;color:var(--mu);padding:20px 0;">Consultando...</div>';
  el('slotsSelW').style.display='none';
  el('btnConf').disabled=true;
  google.script.run
    .withSuccessHandler(r=>{
      if(!r.ok){el('calW').innerHTML=`<p style="color:#991b1b;">${e(r.message)}</p>`;return;}
      B.slots=r.data||[];rCal();
    })
    .withFailureHandler(()=>{el('calW').innerHTML='<p style="color:#991b1b;">Erro. Recarregue.</p>';})
    .apiGetSlotsDisponibles(B.prof.id,Number(B.svc.duracion_min||30));
}

function rCal(){
  if(!B.slots.length){
    el('calW').innerHTML='<div class="no-sl">Sem horários disponíveis nos próximos 14 dias para este serviço/profissional.</div>';
    rResumen();
    return;
  }
  const byF={};
  B.slots.forEach(s=>{if(!byF[s.fecha])byF[s.fecha]=[];byF[s.fecha].push(s);});
  const fechas=Object.keys(byF).sort();
  const sem={};
  fechas.forEach(f=>{
    const d=new Date(f+'T12:00:00');
    const lun=new Date(d);lun.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));
    const k=lun.toISOString().slice(0,10);if(!sem[k])sem[k]=[];sem[k].push(f);
  });
  let html='';
  Object.keys(sem).sort().forEach((sk,si)=>{
    const fs=sem[sk].sort();
    const d0=new Date(sk+'T12:00:00'),d1=new Date(d0.getTime()+6*864e5);
    html+=`<div class="sem-lbl">${si===0?'Esta semana':`${d0.getDate()} ${MES[d0.getMonth()]} – ${d1.getDate()} ${MES[d1.getMonth()]}`}</div>`;
    fs.forEach(fecha=>{
      const d=new Date(fecha+'T12:00:00');
      html+=`<div class="day-row"><div class="day-name">${DIAS[d.getDay()]} <span style="font-weight:400;color:var(--mu);">${d.getDate()}/${d.getMonth()+1}</span></div><div class="slots-row">`;
      byF[fecha].forEach(sl=>{
        const isSel=B.sEleg.some(x=>x.fecha===sl.fecha&&x.hora_inicio===sl.hora_inicio);
        html+=`<div class="slot${isSel?' sel':''}" onclick="togSlot('${sl.fecha}','${sl.hora_inicio}','${sl.hora_fin}')">${sl.hora_inicio}</div>`;
      });
      html+='</div></div>';
    });
  });
  el('calW').innerHTML=html;
  rChips();rResumen();
}

function togSlot(f,hi,hf){
  const idx=B.sEleg.findIndex(s=>s.fecha===f&&s.hora_inicio===hi);
  if(idx>=0)B.sEleg.splice(idx,1);
  else B.sEleg.push({fecha:f,hora_inicio:hi,hora_fin:hf});
  rCal();
}

function rChips(){
  const w=el('slotsSelW'),chips=el('sChips');
  if(!B.sEleg.length){w.style.display='none';return;}
  chips.innerHTML=B.sEleg.map(s=>{
    const d=new Date(s.fecha+'T12:00:00');
    return`<span class="chip">📅 ${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1} ${s.hora_inicio}<button onclick="togSlot('${s.fecha}','${s.hora_inicio}','${s.hora_fin}')">×</button></span>`;
  }).join('');
  w.style.display='block';
}

function rResumen(){
  const mon=B.pub.moneda||'$';
  const tot=Number(B.svc?.precio||0)*B.sEleg.length;
  let html='';
  if(B.svc){
    html+=`<div class="rs-row"><div class="rs-lbl">Serviço</div><div class="rs-val">${e(B.svc.nombre)}<br><span style="font-weight:400;color:var(--mu);font-size:11px;">${B.svc.duracion_min} min · ${mon} ${Number(B.svc.precio||0).toLocaleString('pt-BR')}</span></div></div>`;
  }
  if(B.sEleg.length){
    B.sEleg.forEach((sl,si)=>{const d=new Date(sl.fecha+'T12:00:00');html+=`<div class="rs-row"><div class="rs-lbl">Horário ${si+1}</div><div class="rs-val">${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1} ${sl.hora_inicio}</div></div>`;});
  } else {
    html+=`<div class="rs-row"><div class="rs-lbl">Horário</div><div class="rs-val" style="color:#f59e0b;">Escolha pelo menos um</div></div>`;
  }
  el('rsLista').innerHTML=html;
  if(tot>0){el('totBox').style.display='flex';el('totAmt').textContent=`${mon} ${tot.toLocaleString('pt-BR')}`;} else el('totBox').style.display='none';
  el('btnConf').disabled=!(B.svc&&B.sEleg.length);
}

/* ─── CONFIRMAR ──────────────────────── */
function confirmar(){
  if(!B.svc){tk('Escolha um serviço','err');return;}
  if(!B.sEleg.length){tk('Escolha pelo menos um horário','err');return;}
  const turnos=B.sEleg.map(sl=>({
    profesional_id:B.prof.id,sucursal_id:B.suc.id,
    fecha:sl.fecha,hora_inicio:sl.hora_inicio,hora_fin:sl.hora_fin,
    servicio_id:B.svc.id
  }));
  ov(true);
  google.script.run
    .withSuccessHandler(r=>{
      ov(false);
      if(!r.ok){tk(r.message,'err');return;}
      const d=r.data;
      const creados=d.creados||[];
      el('succMsg').innerHTML=
        `<strong>${e(B.cli.nombre)}</strong>, recebemos sua solicitação:<br><br>`+
        creados.map(c=>{const dt=new Date(c.fecha+'T12:00:00');return`<span class="tag">📅 ${DIAS[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1} ${c.hora_inicio} — ${e(c.svc_nombre||B.svc.nombre)}</span>`;}).join(' ')+
        `<br><br>A empresa confirmará pelo WhatsApp em breve. Código: <strong>${e(d.solicitud_id||'')}</strong>`;
      const wa=el('waCta');
      if(d.waLink){wa.href=d.waLink;wa.style.display='flex';}
      else wa.style.display='none';
      gt('p5',5);
    })
    .withFailureHandler(()=>{ov(false);tk('Erro. Tente novamente.','err');})
    .apiBookingConfirm({
      cliente_id:B.cli.id,cliente_nombre:B.cli.nombre,
      cliente_telefono:B.cli.telefono,cliente_email:B.cli.email||'',
      nota:el('nota').value.trim(),
      session_id:B.sid,turnos
    });
}

function reiniciar(){
  Object.assign(B,{cli:null,suc:null,prof:null,svc:null,slots:[],sEleg:[],_dni:''});
  el('dniI').value='';hd('cliOk');hd('cliNew');hd('profP');el('nota').value='';
  paso1();
}

/* ─── NAV ────────────────────────────── */
function gt(pid,n){
  ['p1','p2','p3','p4','p5'].forEach(id=>{
    const el_=document.getElementById(id);if(el_)el_.style.display=id===pid?'block':'none';
  });
  for(let i=1;i<=4;i++){
    const d_=document.getElementById('d'+i),lb_=document.getElementById('lb'+i);
    if(!d_)continue;
    d_.className='sdot'+(i===n?' on':i<n?' done':'');
    if(lb_)lb_.className='slbl'+(i===n?' on':i<n?' done':'');
    if(i<4){const li_=document.getElementById('l'+i+(i+1));if(li_)li_.className='sline'+(i<n?' done':'');}
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function paso1(){gt('p1',1);}

/* ─── UTILS ──────────────────────────── */
function el(id){return document.getElementById(id);}
function sh(id){const e_=el(id);if(e_)e_.style.display='block';}
function hd(id){const e_=el(id);if(e_)e_.style.display='none';}
function css(k,v){document.documentElement.style.setProperty(k,v);}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function ov(on){el('ov').classList.toggle('show',on);}
let _tt=null;
function tk(msg,tp=''){
  const t=el('toast');t.textContent=msg;t.className='show'+(tp==='err'?' err':'');
  clearTimeout(_tt);_tt=setTimeout(()=>t.className='',3500);
}

  if(document.documentElement.classList.contains('booking-mode')){
    document.getElementById('bookingHost').srcdoc =
      document.getElementById('bookingTpl').textContent
        .replaceAll('<\\/script>','<\/script>')

<script>
const API_URL = '/api/gas';

/* ════════════════════════════════════════════════════
   ESTADO GLOBAL
════════════════════════════════════════════════════ */
const App = {
  session:      null,
  view:         'dashboard',
  selectedDate: new Date().toISOString().slice(0,10),
  data: { usuarios:[], sucursales:[], servicios:[], clientes:[], disponibilidad:[], ajustes:[], turnos:[], solicitudes:[] },
  etags: {},         // { nombreHoja: rowCount } para delta bootstrap
  charts: {},
  syncing: false,
  syncTimer: null,
  chartPromise: null,
  _searchTimer: null,
  _clientSearchTimer: null
};

const KEYS = {
  session:   'GTURNOS_SESSION',
  bootstrap: 'GTURNOS_BOOTSTRAP',
  etags:     'GTURNOS_ETAGS'
};

const VIEW_META = {
  dashboard:   ['Dashboard','Visão geral do dia.'],
  agenda:      ['Agenda inteligente','Agendamentos por profissional, unidade e data.'],
  clientes:    ['Clientes','Base de clientes e histórico operacional.'],
  alertas:     ['Alertas','Central operacional: solicitações novas, avisos, pagamentos e novidades críticas.'],
  profissionais:['Profissionais','Cadastro, edição e status dos profissionais.'],
  solicitudes: ['Solicitações','Pedidos recebidos pelo portal público.'],
  config:      ['Configurações','Empresa, pagamentos, serviços, unidades e horários.'],
  reportes:    ['Relatórios','Indicadores de produtividade e status.']
};

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  if(document.documentElement.classList.contains('booking-mode')) return;
  // Intentar restaurar ajustes de marca del localStorage (para login screen)
  const cached = localStorage.getItem(KEYS.bootstrap);
  if (cached) {
    try {
      App.data = JSON.parse(cached);
      App.etags = JSON.parse(localStorage.getItem(KEYS.etags)||'{}');
      applyAjustes(true); // solo login screen
    } catch(e){}
  }

  bindLogin();
  bindNav();
  bindGlobalSearch();

  const saved = localStorage.getItem(KEYS.session);
  if (saved) {
    try {
      App.session = JSON.parse(saved);
      startApp();
    } catch(e){ localStorage.removeItem(KEYS.session); }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && App.session) revalidate(true);
    scheduleSync();
  });
});

/* ════════════════════════════════════════════════════
   LOGIN
════════════════════════════════════════════════════ */
function bindLogin() {
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Entrando...'; btn.disabled = true;

    gsRun('apiLogin',
      [document.getElementById('loginEmail').value.trim(),
       document.getElementById('loginPassword').value],
      res => {
        btn.textContent = normPt(getSetting('Texto_Login_Boton'))||'Entrar'; btn.disabled = false;
        if (!res.ok) return toast(res.message||'Não foi possível entrar.','error');
        App.session = res.data;
        localStorage.setItem(KEYS.session, JSON.stringify(App.session));
        startApp();
      },
      err => { btn.textContent = 'Entrar'; btn.disabled = false; toast(err.message,'error'); }
    );
  });
}

function startApp() {
  el('loginScreen').classList.add('hidden');
  el('app').classList.remove('hidden');
  el('sideUserName').textContent = App.session.nombre;
  el('sideUserRole').textContent = tpal(App.session.rol);
  applyVisualPerms();
  renderView(App.view);            // render inmediato desde caché
  updateAlertBadge();
  revalidate(true);                // revalidación silenciosa en background
  scheduleSync();
}

/* ════════════════════════════════════════════════════
   BOOTSTRAP DELTA
════════════════════════════════════════════════════ */
function revalidate(silent) {
  if (App.syncing || !App.session) return;
  App.syncing = true;
  const rb = el('refreshBtn');
  if (rb) { rb.disabled = true; rb.textContent = silent ? '↻ Atualizando...' : '↻ Atualizando dados...'; }
  if (!silent) toast('Atualizando dados...');
  gsRun('apiGetBootstrap', [App.session, App.etags], res => {
    App.syncing = false;
    if (rb) { rb.disabled = false; rb.textContent = '↻ Atualizar dados'; }
    if (!res.ok) return silent ? null : toast(res.message,'error');

    let changed = false;
    for (const [key, val] of Object.entries(res.data)) {
      if (val === null) continue; // sin cambios para esta hoja
      App.data[key]  = val.data;
      App.etags[key] = val.rowCount;
      changed = true;
    }

    if (changed) {
      localStorage.setItem(KEYS.bootstrap, JSON.stringify(App.data));
      localStorage.setItem(KEYS.etags, JSON.stringify(App.etags));
      applyAjustes(false);
      renderView(App.view); // re-render solo la vista activa
    }
    updateAlertBadge();
    if (!silent) toast(changed ? 'Dados atualizados.' : 'Os dados já estavam atualizados.');
  }, err => {
    App.syncing = false;
    if (rb) { rb.disabled = false; rb.textContent = '↻ Atualizar dados'; }
    return silent ? null : toast(err.message,'error');
  });
}

function scheduleSync(){
  clearInterval(App.syncTimer);
  if (!App.session) return;
  const interval = document.hidden ? 45000 : 7000;
  App.syncTimer = setInterval(()=>revalidate(true), interval);
}

function manualRefresh(){
  if (!App.session) return;
  revalidate(false);
}

function bindNav() {
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      switchView(btn.dataset.view);
      closeMobileMenu();
    });
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeMobileMenu(); } });

function switchView(view) {
  if (!App.session) return;
  if ((view==='config'||view==='reportes'||view==='profesionales') && App.session.rol!=='Admin') return;
  App.view = view;

  document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
  el('view-'+view).classList.remove('hidden');
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===view));

  const [title, sub] = VIEW_META[view]||[view,''];
  el('viewTitle').textContent = title;
  el('viewSub').textContent = sub;
  setIfExists('mobileViewName', node=>node.textContent=title);

  renderView(view);
}

function toggleMobileMenu(){
  const sidebar=document.querySelector('.sidebar');
  const app=el('app');
  const button=document.querySelector('.mobile-menu-toggle');
  const open=!sidebar.classList.contains('mobile-open');
  sidebar.classList.toggle('mobile-open',open);
  app.classList.toggle('mobile-menu-open',open);
  button?.setAttribute('aria-expanded',String(open));
  document.body.style.overflow=open?'hidden':'';
}

function closeMobileMenu(){
  document.querySelector('.sidebar')?.classList.remove('mobile-open');
  el('app')?.classList.remove('mobile-menu-open');
  document.querySelector('.mobile-menu-toggle')?.setAttribute('aria-expanded','false');
  document.body.style.overflow='';
}

function renderView(view) {
  if (!App.session) return;
  if (view==='dashboard')   renderDashboard();
  else if (view==='agenda')      renderAgenda();
  else if (view==='clientes')    renderClientes();
  else if (view==='alertas')     renderAlertas();
  else if (view==='profesionales') renderProfesionales();
  else if (view==='solicitudes') renderSolicitudes();
  else if (view==='config')      renderConfig();
  else if (view==='reportes')  { renderReportes(); setTimeout(renderCharts,60); }
}

/* ── Tradução de status para EXIBIÇÃO (pt-BR). Os valores armazenados no backend
      e as comparações internas permanecem inalterados (compatibilidade total). ── */
const PT_STATUS={'Pendiente':'Pendente','Confirmado':'Confirmado','Realizado':'Realizado','Cancelado':'Cancelado','Reprogramado':'Reagendado','Ausente':'Ausente','Sin pago':'Sem pagamento','Link enviado':'Link enviado','Enviado':'Enviado','Seña pagada':'Sinal pago','Pagado':'Pago','Reembolsado':'Reembolsado','Nueva':'Nova','Contactada':'Contatada','Confirmada':'Confirmada','Cancelada':'Cancelada','Activo':'Ativo','Inactivo':'Inativo','Admin':'Administrador','Staff':'Profissional','Recepcionista':'Recepcionista'};

/* ── Normaliza textos padrão antigos salvos em espanhol para exibir em pt-BR ── */
const PT_TEXTOS={'Gestión de Turnos PRO':'Gestão de Agendamentos PRO','Gestion de Turnos PRO':'Gestão de Agendamentos PRO','Bienvenido':'Bem-vindo','Ingresá para gestionar tus turnos.':'Entre para gerenciar seus agendamentos.','Ingresá para gestionar tu agenda.':'Entre para gerenciar sua agenda.','Ingresar':'Entrar'};
function normPt(v){ return PT_TEXTOS[String(v||'').trim()]||v; }

function gsRun(fn, args, onSuccess, onError) {
  const fail = onError || (e => toast(e.message||String(e),'error'));
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 45000); // evita esperas infinitas
  fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:fn,args:args||[]}),
    signal:ctrl.signal
  })
    .then(r=>{ clearTimeout(timer); return r.ok ? r.json() : Promise.reject(new Error('Error HTTP '+r.status)); })
    .then(onSuccess)
    .catch(err=>{
      clearTimeout(timer);
      fail(err && err.name==='AbortError' ? new Error('Tempo de espera esgotado. Tente novamente.') : err);
    });
}

/* Guarda ajustes en el servidor y replica el cambio en el caché local (optimista). */
function saveAjustes(obj, okMsg, after) {
  gsRun('apiSaveAjustes',[obj,App.session],res=>{
    if (!res.ok) return toast(res.message,'error');
    Object.entries(obj).forEach(([k,v])=>{
      const row = App.data.ajustes.find(a=>a.clave===k);
      if (row) row.valor=v; else App.data.ajustes.push({clave:k,valor:v});
    });
    if (okMsg) toast(okMsg);
    if (after) after();
  });
}

function getSetting(key) {
  const row = App.data.ajustes.find(a => a.clave===key);
  return row ? row.valor : '';
}

function byId(list, id) { return list.find(x=>x.id===id)||{}; }
function moneda()       { return getSetting('Moneda')||'$'; }

function profesionales() {
  return App.data.usuarios.filter(u=>u.rol==='Staff'&&u.estado==='Activo');

function visibleTurnos() {

  return App.data.turnos;
}

function formatMoney(n) {
  return moneda()+' '+Number(n||0).toLocaleString('pt-BR');

function eh(s){ // escapeHtml
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

function applyVisualPerms() {

function toast(msg, type='ok') {
  const div = document.createElement('div');
  div.className = 'toastx';
  div.style.borderLeftColor = type==='error'?'#ff8fa3':'var(--accent)';
  div.textContent = (type==='error'?'❌ ':'✅ ') + msg;
  el('toastRoot').appendChild(div);
  setTimeout(()=>div.remove(), 3400);
}

  el('modalRoot').innerHTML = `
    <div class="modalx-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
      <div class="modalx" role="dialog" aria-modal="true">

          <button class="modalx-close" onclick="closeModal()">×</button>

        <div class="modalx-body">${bodyHtml}</div>
      </div>

}

function handleBackdropClick(e) {

function bindGlobalSearch() {
  const inp = el('globalSearch');
  const dd  = el('globalSearchDropdown');

  inp.addEventListener('input', debounce(()=>{
    const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.add('hidden'); dd.innerHTML=''; return; }

    const res = App.data.clientes.filter(c=>
      c.nombre?.toLowerCase().includes(q)||
      c.dni_cuit?.includes(q)||
      c.telefono?.includes(q)||
      c.email?.toLowerCase().includes(q)
    ).slice(0,8);

    if (!res.length) { dd.classList.add('hidden'); return; }

    dd.innerHTML = res.map(c=>`
      <div class="search-dropdown-item" onclick="clienteQuickAction('${c.id}')">
        <strong>${eh(c.nombre)}</strong>
        <span>${eh(c.telefono||'')} · ${eh(c.dni_cuit||'')}</span>
      </div>`).join('');
    dd.classList.remove('hidden');
  }, 280));

  document.addEventListener('click', e=>{
    if (!inp.contains(e.target)&&!dd.contains(e.target)) dd.classList.add('hidden');
  });
}

function clienteQuickAction(id) {
  el('globalSearchDropdown').classList.add('hidden');

  openClienteModal(id);

        <div class="ag-head" style="border-radius:${profsFiltered.length?'':'var(--r)'} 0 0 0;">Hora</div>
        ${profsFiltered.map(p=>{
          const suc=byId(App.data.sucursales,p.sucursal_id);

    </div>`;

  root._filterSuc = filterSuc; // preservar estado

  const clienteNombre = t.cliente_id ? (byId(App.data.clientes,t.cliente_id).nombre||'') : '';

  openModal(id?'Detalhe do agendamento':'Novo agendamento', `

      <input type="hidden" name="id" value="${eh(t.id||'')}">
      <input type="hidden" name="cliente_id" id="tClienteId" value="${eh(t.cliente_id||'')}">

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Data</label>
          <input class="form-control" type="date" name="fecha" value="${eh(t.fecha||App.selectedDate)}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Hora início</label>
          <input class="form-control" type="time" name="hora_inicio" id="tHoraInicio" value="${eh(t.hora_inicio||'08:00')}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Serviço</label>
          <select class="form-select" name="servicio_id" id="tServicio" required onchange="previewHoraFin()">
            <option value="">Selecionar...</option>${svcOpts}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Término estimado</label>
          <input class="form-control" name="hora_fin" id="tHoraFin" value="${eh(t.hora_fin||'')}" readonly>
        </div>

        <div class="col-md-6">
          <label class="form-label">Cliente</label>
          <div class="client-ac-wrap">
            <input class="form-control" type="text" id="tClienteSearch" placeholder="Buscar por nome, CPF..." autocomplete="off"
              value="${eh(clienteNombre)}" oninput="clienteAcInput(this.value)">
            <div id="clienteAcList" class="client-ac-list hidden"></div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Profissional</label>
          <select class="form-select" name="profesional_id" required>
            <option value="">Selecionar...</option>${profsOpts}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Unidade</label>
          <select class="form-select" name="sucursal_id" required>
            <option value="">Selecionar...</option>${sucOpts}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select class="form-select" name="estado">
            ${estados.map(s=>`<option value="${s}"${s===t.estado?' selected':''}>${tpal(s)}</option>`).join('')}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Status do pagamento</label>
          <input type="hidden" name="pago_estado" value="${eh(t.pago_estado||'Sin pago')}">
          <input class="form-control" value="${eh(tpal(t.pago_estado||'Sin pago'))}" readonly>
        </div>

        <div class="col-12">
          <label class="form-label">Observação</label>
          <textarea class="form-control" name="nota" rows="2">${eh(t.nota||'')}</textarea>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-between gap-2 mt-4">
        <div class="d-flex gap-2 flex-wrap">
          ${id?`<button type="button" class="btn-soft" onclick="openWhatsApp('${t.id}')">📲 WhatsApp</button>`:''}
          ${id?`<button type="button" class="btn-soft" onclick="sendPago('${t.id}')">💳 Enviar pagamento</button>`:''}
          ${id&&['Link enviado','Enviado','Seña pagada'].includes(t.pago_estado||'')?`<button type="button" class="btn-soft" style="background:#d1fae5;color:#065f46;border-color:#6ee7b7;" onclick="marcarPagado('${t.id}')">✅ Marcar pagado</button>`:''}
          ${id?`<button type="button" class="btn-soft" onclick="sendMail('${t.id}')">✉️ E-mail</button>`:''}
          ${id?`<button type="button" class="btn-soft" onclick="cambiarEstadoRapido('${t.id}','Realizado')">☑️ Realizado</button>`:''}
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn-soft" onclick="closeModal()">Fechar</button>
          ${canDel?`<button type="button" class="btn-danger" onclick="deleteTurno('${t.id}')">🗑 Excluir</button>`:''}
          <button type="submit" class="btn-navy">💾 Salvar</button>
        </div>
      </div>
    </form>`);

  // Ajustar hora fin si servicio ya seleccionado
  el('tHoraInicio').addEventListener('change', previewHoraFin);
  previewHoraFin();

  el('turnoForm').onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    // Agregar cliente_id del hidden
    data.cliente_id = el('tClienteId').value;
    if (!data.cliente_id) { toast('Selecione um cliente.','error'); return; }
    saveTurno(data);
  };
}

/* Autocomplete de cliente en modal */
function clienteAcInput(q) {
  const acList = el('clienteAcList');
  if (!acList) return;
  if (!q || q.length < 2) { acList.classList.add('hidden'); return; }

  const res = App.data.clientes.filter(c=>
    c.nombre?.toLowerCase().includes(q.toLowerCase())||
    c.dni_cuit?.includes(q)||
    c.telefono?.includes(q)
  ).slice(0,7);

  if (!res.length) { acList.classList.add('hidden'); return; }

  acList.innerHTML = res.map(c=>`
    <div class="client-ac-item" onclick="selectClienteAc('${c.id}')">
      <b>${eh(c.nombre)}</b>
      <span>${eh(c.telefono||'')} · ${eh(c.dni_cuit||'')}</span>
    </div>`).join('');
  acList.classList.remove('hidden');
}

function selectClienteAc(id) {
  el('tClienteId').value     = id;
  el('tClienteSearch').value = byId(App.data.clientes, id).nombre||'';
  el('clienteAcList').classList.add('hidden');
}

function previewHoraFin() {
  const svcId = el('tServicio')?.value;
  const hora  = el('tHoraInicio')?.value;
  const fin   = el('tHoraFin');
  if (!svcId || !hora || !fin) return;
  const s = byId(App.data.servicios, svcId);
  if (!s.duracion_min) return;
  const [h,m] = hora.split(':').map(Number);
  const tot = h*60+m+Number(s.duracion_min);
  fin.value = String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}

function profsForSelect() {
  return App.session.rol==='Staff'
    ? profesionales().filter(p=>p.id===App.session.id)
    : profesionales();
}

function saveTurno(obj) {
  if (App.session.rol==='Staff') obj.profesional_id = App.session.id;
  gsRun('apiSaveTurno', [obj, App.session], res => {
    if (!res.ok) return toast(res.message,'error');
    closeModal();
    toast('Agendamento salvo.');
    // Optimistic update local
    const idx = App.data.turnos.findIndex(t=>t.id===res.data.id);
    if (idx>=0) App.data.turnos[idx]=res.data;
    else App.data.turnos.push(res.data);
    renderView(App.view);
    revalidate(true); // sync silencioso
  });
}

function cambiarEstadoRapido(id, estado) {
  gsRun('apiChangeTurnoEstado',[id,estado,App.session], res=>{
    if (!res.ok) return toast(res.message,'error');
    closeModal(); toast('Status atualizado.');
    // Optimistic
    const idx = App.data.turnos.findIndex(t=>t.id===id);
    if (idx>=0) App.data.turnos[idx].estado = estado;
    renderView(App.view);
    revalidate(true);
  });
}

function deleteTurno(id) {
  confirmX('Excluir este agendamento? Esta ação não pode ser desfeita.',()=>{
    gsRun('apiDeleteTurno',[id,App.session],res=>{
      if (!res.ok) return toast(res.message,'error');
      closeModal(); toast('Agendamento excluído.');
      App.data.turnos = App.data.turnos.filter(t=>t.id!==id);
      renderView(App.view);
      revalidate(true);
    });
  });
}

function openWhatsApp(id) {
  gsRun('apiBuildWhatsAppLink',[id,App.session],res=>{
    if (!res.ok) return toast(res.message,'error');
    window.open(res.data,'_blank');
  });
}

function sendPago(id) {
  // Verificar que haya métodos de pago configurados antes de llamar al servidor
  const hasPago = getSetting('Pago_CBU')||getSetting('Pago_Alias')||getSetting('Pago_MP')||getSetting('Pago_Otro_Link');
  if (!hasPago) {
    toast('Configure pelo menos um método de pagamento em ⚙️ Configurações → Pagamentos.','error');
    return;
  }
  confirmX('Enviar detalhes de pagamento ao cliente por WhatsApp? O pagamento será marcado como "Link enviado" sem alterar o status do agendamento.',()=>{
    gsRun('apiBuildPagoClienteLink',[id,App.session], res=>{
      if (!res.ok) return toast(res.message,'error');
      // Optimistic update
      const idx=App.data.turnos.findIndex(t=>t.id===id);
      if (idx>=0) App.data.turnos[idx].pago_estado='Link enviado';
      closeModal();
      window.open(res.data,'_blank');
      toast('Detalhes de pagamento gerados. Pagamento → Link enviado.');
      renderView(App.view); revalidate(true);
    });
  });
}

function marcarPagado(id) {
  confirmX('Confirmar que o pagamento foi recebido? O agendamento passará para "Pago".',()=>{
    gsRun('apiMarcarPagado',[id,App.session],res=>{
      if (!res.ok) return toast(res.message,'error');
      const idx=App.data.turnos.findIndex(t=>t.id===id);
      if (idx>=0) App.data.turnos[idx].pago_estado='Pagado';
      closeModal(); toast('Pagamento marcado como recebido ✅');
      renderView(App.view); revalidate(true);
    });
  });
}

function enviarRecordatorio(clienteId) {
  gsRun('apiEnviarRecordatorioWA',[clienteId,App.session],res=>{
    if (!res.ok) return toast(res.message,'error');
    window.open(res.data.waLink,'_blank');
    toast('WhatsApp aberto com o lembrete.');
  });
}

function sendMail(id) {
  confirmX('Enviar lembrete por e-mail ao cliente?',()=>{
    gsRun('apiSendReminderEmail',[id,App.session],res=>{
      if (!res.ok) return toast(res.message,'error');
      toast('E-mail enviado.');
    });
  });
}

/* ════════════════════════════════════════════════════
   CLIENTES
════════════════════════════════════════════════════ */
function renderClientes(filter='') {
  const root = el('view-clientes');
  const canEdit = ['Admin','Recepcionista'].includes(App.session.rol);

  let list = App.data.clientes;
  if (filter) {
    const q = filter.toLowerCase();
    list = list.filter(c=>
      c.nombre?.toLowerCase().includes(q)||
      c.dni_cuit?.includes(q)||
      c.telefono?.includes(q)||
      c.email?.toLowerCase().includes(q)
    );
  }

  root.innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="search-box" style="flex:1;max-width:340px;">
        <span>🔎</span>
        <input id="clientSearch" placeholder="Buscar por nome, CPF, telefone..." value="${eh(filter)}"
          oninput="clientSearchInput(this.value)">
      </div>
      ${canEdit?`<button class="btn-navy" onclick="openClienteModal()">+ Novo cliente</button>`:''}
    </div>

    <div class="client-grid">
      ${list.length ? list.map(c=>`
        <div class="client-card card-soft">
          <h4>${eh(c.nombre)}</h4>
          <div style="font-size:12px;color:var(--muted);">CPF: ${eh(c.dni_cuit||'—')}</div>
          <div style="margin-top:6px;font-size:13px;">📞 ${eh(c.telefono||'—')}</div>
          <div style="font-size:13px;">✉️ ${eh(c.email||'—')}</div>
          ${c.notas_historial?`<p style="font-size:12px;color:var(--muted);margin-top:6px;">${eh(c.notas_historial)}</p>`:''}
          <div class="d-flex gap-2 mt-3">
            ${canEdit?`<button class="btn-soft" onclick="openClienteModal('${c.id}')">✏️ Editar</button>`:''}
            <button class="btn-soft" onclick="openTurnoConCliente('${c.id}')">+ Agendamento</button>
            <button class="btn-soft" style="background:#f0fdf4;color:#065f46;border-color:#6ee7b7;" onclick="enviarRecordatorio('${c.id}')">📲 Lembrete</button>
          </div>
        </div>`).join('')
        : `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:32px;">Nenhum resultado.</div>`}
    </div>`;
}

const clientSearchInput = debounce(q=>renderClientes(q), 280);

function openClienteModal(id='') {
  if (!['Admin','Recepcionista'].includes(App.session.rol)) return toast('Sem permissão.','error');
  const c = id ? byId(App.data.clientes,id) : {};
  openModal(id?'Editar cliente':'Novo cliente',`
    <form id="clienteForm">
      <input type="hidden" name="id" value="${eh(c.id||'')}">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nombre" value="${eh(c.nombre||'')}" required></div>
        <div class="col-md-6"><label class="form-label">CPF / CNPJ</label><input class="form-control" name="dni_cuit" value="${eh(c.dni_cuit||'')}"></div>
        <div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" name="telefono" value="${eh(c.telefono||'')}"></div>
        <div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" value="${eh(c.email||'')}"></div>
        <div class="col-12"><label class="form-label">Observações / histórico</label><textarea class="form-control" name="notas_historial" rows="3">${eh(c.notas_historial||'')}</textarea></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn-soft" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn-navy">💾 Salvar</button>
      </div>
    </form>`);

  el('clienteForm').onsubmit = e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    gsRun('apiSaveCliente',[data,App.session],res=>{
      if (!res.ok) return toast(res.message,'error');
      closeModal(); toast('Cliente salvo.');
      // Optimistic
      const idx = App.data.clientes.findIndex(c=>c.id===res.data.id);
      if (idx>=0) App.data.clientes[idx]=res.data; else App.data.clientes.push(res.data);
      renderView(App.view);
      revalidate(true);
    });
  };
}

function openTurnoConCliente(clienteId) {
  openTurnoModal();
  setTimeout(()=>{
    const c = byId(App.data.clientes,clienteId);
    const cid = el('tClienteId'); const cs = el('tClienteSearch');
    if (cid) cid.value = clienteId;
    if (cs)  cs.value  = c.nombre||'';
  }, 50);
}


function isSetupComplete(){
  return String(getSetting('Setup_Completo')||'').toUpperCase()==='SI';
}
function setupWizardHTML(){
  const checks = [
    ['Dados da empresa', !!getSetting('Nombre_Empresa') && !!getSetting('Nombre_Sistema')],
    ['Logo ou iniciais', !!getSetting('Logo_URL') || !!getSetting('Iniciales_Marca')],
    ['Serviços cadastrados', (App.data.servicios||[]).length>0],
    ['Unidades cadastradas', (App.data.sucursales||[]).length>0],
    ['Profissionais ativos', profesionales().length>0],
    ['Horários de atendimento', (App.data.disponibilidad||[]).length>0],
    ['WhatsApp / pagamentos', !!getSetting('WA_Negocio') && (!!getSetting('Pago_CBU') || !!getSetting('Pago_Alias') || !!getSetting('Pago_MP'))]
  ];
  const ok = checks.filter(x=>x[1]).length;
  return `<div class="panel card-soft" style="border-left:5px solid var(--accent);margin-bottom:16px;">
    <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
      <div>
        <h3 style="margin:0 0 6px;color:var(--navy);">🚀 Configuração inicial do sistema</h3>
        <p style="font-size:13px;color:var(--muted);margin:0;">Isso é feito após a publicação. Você não precisa mexer em código para alterar marca, serviços, horários, pagamentos ou WhatsApp.</p>
      </div>
      <div style="font-size:22px;font-weight:900;color:var(--navy);">${ok}/${checks.length}</div>
    </div>
    <div class="row g-2 mt-3">
      ${checks.map(([label,done])=>`<div class="col-md-3 col-sm-6"><div style="padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:${done?'#f0fdf4':'#fff7ed'};font-size:12px;font-weight:700;color:${done?'#065f46':'#92400e'};">${done?'✅':'⚠️'} ${label}</div></div>`).join('')}
    </div>
    <button class="btn-navy mt-3" onclick="marcarSetupCompleto()">Marcar instalação como concluída</button>
  </div>`;
}
function marcarSetupCompleto(){
  saveAjustes({Setup_Completo:'SI'},'Instalação marcada como concluída.', renderConfig);
}
