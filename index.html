/* ════════════════════════════════════════════════════
   ALERTAS MANUALES
════════════════════════════════════════════════════ */
function localISODate(d=new Date()){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function addDaysISO(days){
  const d = new Date(); d.setDate(d.getDate()+days);
  return localISODate(d);
}
function parseISODateSafe(v){
  const s = String(v||'').slice(0,10);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function diffDaysISO(a,b){
  const da = parseISODateSafe(a), db = parseISODateSafe(b);
  if(!da||!db) return 0;
  return Math.round((db-da)/(24*60*60*1000));
}
function pagoPendiente(t){
  const p = String(t.pago_estado||'Sin pago');
  return !['Pagado','Seña pagada','Reembolsado'].includes(p);
}
function solicitudAgeLabel(s){
  const fs = String(s.fecha_solicitud||'').slice(0,10);
  const d = diffDaysISO(fs, addDaysISO(0));
  if(!fs || d<=0) return 'Recebida hoje';
  if(d===1) return 'Recebida ontem';
  return `Há ${d} dias`;
}
function alertasPendientes(){
  const hoy = addDaysISO(0), manana = addDaysISO(1);
  const alerts = [];

  // 1) Solicitudes nuevas: prioridad máxima para que el operador las vea apenas abre la app.
  if(['Admin','Recepcionista'].includes(App.session?.rol||'')){
    (App.data.solicitudes||[])
      .filter(s=>s.estado==='Nueva')
      .forEach(s=>{
        alerts.push({
          tipo:'SOL_NUEVA', origen:'solicitud', id:s.id, prioridad:0,
          icon:'🛒', label:'Nova solicitação', badge:'Nova',
          titulo:s.nombre_cliente||'Cliente',
          subtitulo:`Solicitação de agendamento · ${solicitudAgeLabel(s)}`,
          detalle:`${String(s.servicios_nombres||'').replace(/\|/g, ', ') || 'Serviços sem detalhe'} · ${moneda()} ${Number(s.total||0).toLocaleString('pt-BR')}`,
          fecha:String(s.fecha_solicitud||'').slice(0,10), hora:String(s.fecha_solicitud||'').slice(11,16),
          color:'#f59e0b'
        });
      });

    // 2) Solicitudes contactadas hace varios días sin confirmar: seguimiento comercial.
    (App.data.solicitudes||[])
      .filter(s=>s.estado==='Contactada')
      .forEach(s=>{
        const fs = String(s.updated_at||s.fecha_solicitud||'').slice(0,10);
        const dias = diffDaysISO(fs, hoy);
        if(dias>=2){
          alerts.push({
            tipo:'SOL_SEGUIMIENTO', origen:'solicitud', id:s.id, prioridad:4,
            icon:'📞', label:'Retomar contato', badge:`${dias} dias`,
            titulo:s.nombre_cliente||'Cliente',
            subtitulo:'Solicitação contatada sem confirmação',
            detalle:`Verificar se confirma, cancela ou deseja novo horário · ${moneda()} ${Number(s.total||0).toLocaleString('pt-BR')}`,
            fecha:fs, hora:'',
            color:'#6366f1'
          });
        }
      });
  }

  // 3) Turnos atrasados no resueltos.
  visibleTurnos()
    .filter(t=>['Pendiente','Confirmado'].includes(t.estado) && String(t.fecha||'') < hoy)
    .forEach(t=>{
      const c = byId(App.data.clientes, t.cliente_id);
      const s = byId(App.data.servicios, t.servicio_id);
      alerts.push({
        tipo:'TURNO_ATRASADO', origen:'turno', id:t.id, prioridad:1,
        icon:'⏰', label:'Atrasado', badge:'Resolver',
        titulo:c.nombre||'Cliente',
        subtitulo:`Agendamento vencido · ${t.fecha} ${t.hora_inicio}`,
        detalle:`${s.nombre||'Serviço'} ficou como ${tpal(t.estado)}. Marque como realizado, cancele ou reagende.`,
        fecha:t.fecha, hora:t.hora_inicio,
        color:'#dc2626'
      });
    });

  // 4) Turnos de hoy sin aviso enviado.
  visibleTurnos()
    .filter(t=>['Pendiente','Confirmado'].includes(t.estado) && t.fecha===hoy && String(t.alerta_dia_enviada||'').toUpperCase()!=='SI')
    .forEach(t=>{
      const c = byId(App.data.clientes, t.cliente_id);
      const s = byId(App.data.servicios, t.servicio_id);
      alerts.push({
        tipo:'TURNO_DIA', origen:'turno', id:t.id, prioridad:2,
        icon:'🔥', label:'Agendamento hoje', badge:t.hora_inicio,
        titulo:c.nombre||'Cliente',
        subtitulo:`Aviso do dia pendente · ${t.fecha}`,
        detalle:`${s.nombre||'Serviço'} · ${c.telefono||'Sem telefone'}`,
        fecha:t.fecha, hora:t.hora_inicio,
        color:'#ef4444'
      });
    });

  // 5) Turnos de mañana sin aviso D-1.
  visibleTurnos()
    .filter(t=>['Pendiente','Confirmado'].includes(t.estado) && t.fecha===manana && String(t.alerta_d1_enviada||'').toUpperCase()!=='SI')
    .forEach(t=>{
      const c = byId(App.data.clientes, t.cliente_id);
      const s = byId(App.data.servicios, t.servicio_id);
      alerts.push({
        tipo:'TURNO_D1', origen:'turno', id:t.id, prioridad:3,
        icon:'🌅', label:'Amanhã', badge:t.hora_inicio,
        titulo:c.nombre||'Cliente',
        subtitulo:`Aviso D-1 pendente · ${t.fecha}`,
        detalle:`${s.nombre||'Serviço'} · ${c.telefono||'Sem telefone'}`,
        fecha:t.fecha, hora:t.hora_inicio,
        color:'#f59e0b'
      });
    });

  // 6) Pagos con link enviado que siguen pendientes.
  visibleTurnos()
    .filter(t=>['Pendiente','Confirmado'].includes(t.estado) && ['Link enviado','Enviado'].includes(String(t.pago_estado||'')))
    .forEach(t=>{
      const c = byId(App.data.clientes, t.cliente_id);
      const s = byId(App.data.servicios, t.servicio_id);
      alerts.push({
        tipo:'PAGO_PENDIENTE', origen:'turno', id:t.id, prioridad:5,
        icon:'💳', label:'Pagamento pendente', badge:'Cobrança',
        titulo:c.nombre||'Cliente',
        subtitulo:`Pagamento enviado sem confirmação · ${t.fecha} ${t.hora_inicio}`,
        detalle:`${s.nombre||'Serviço'} · ${formatMoney(byId(App.data.servicios,t.servicio_id).precio||0)}`,
        fecha:t.fecha, hora:t.hora_inicio,
        color:'#7c3aed'
      });
    });

  // 7) Turnos realizados sin pago confirmado.
  visibleTurnos()
    .filter(t=>t.estado==='Realizado' && pagoPendiente(t))
    .forEach(t=>{
      const c = byId(App.data.clientes, t.cliente_id);
      const s = byId(App.data.servicios, t.servicio_id);
      alerts.push({
        tipo:'REALIZADO_SIN_PAGO', origen:'turno', id:t.id, prioridad:6,
        icon:'🧾', label:'Cobrança a verificar', badge:'Sem pagamento',
        titulo:c.nombre||'Cliente',
        subtitulo:`Agendamento realizado sem pagamento registrado · ${t.fecha}`,
        detalle:`${s.nombre||'Serviço'} · ${formatMoney(s.precio||0)}`,
        fecha:t.fecha, hora:t.hora_inicio,
        color:'#0f766e'
      });
    });

  // 8) Profesionales activos sin disponibilidad: alerta de configuración.
  if(App.session?.rol==='Admin'){
    const dispByUser = new Set((App.data.disponibilidad||[]).map(d=>d.usuario_id));
    profesionales().filter(p=>!dispByUser.has(p.id)).forEach(p=>{
      alerts.push({
        tipo:'PROF_SIN_DISP', origen:'config', id:p.id, prioridad:7,
        icon:'🧑‍💼', label:'Sem disponibilidade', badge:'Config',
        titulo:p.nombre||'Profissional',
        subtitulo:'Profissional ativo sem horários cadastrados',
        detalle:'Não aparecerá corretamente no portal público até cadastrar a disponibilidade.',
        fecha:'', hora:'',
        color:'#0284c7'
      });
    });

    // 9) Servicios activos con duración o precio inválido.
    (App.data.servicios||[]).filter(s=>s.estado!=='Inactivo').forEach(s=>{
      const dur = Number(s.duracion_min||s.duracion||0);
      const precio = Number(s.precio||0);
      if(!dur || dur<=0 || precio<0){
        alerts.push({
          tipo:'SERVICIO_INCOMPLETO', origen:'config', id:s.id, prioridad:8,
          icon:'🛎️', label:'Serviço incompleto', badge:'Config',
          titulo:s.nombre||'Serviço',
          subtitulo:'Verificar duração ou preço',
          detalle:'A duração é obrigatória para calcular corretamente os horários disponíveis.',
          fecha:'', hora:'',
          color:'#b45309'
        });
      }
    });
  }

  return alerts.sort((a,b)=>a.prioridad-b.prioridad || String(a.fecha||'').localeCompare(String(b.fecha||'')) || String(a.hora||'').localeCompare(String(b.hora||'')));
}
function updateAlertBadge(){
  const n = alertasPendientes().length;
  const b = el('navAlertBadge');
  if (b) { b.textContent = n; b.classList.toggle('on', n>0); }
  document.querySelectorAll('[data-view="alertas"]').forEach(btn=>{
    btn.classList.toggle('has-alerts', n>0);
  });
}
function renderAlertas(){
  const root = el('view-alertas');

  const turnoN = alerts.filter(a=>['TURNO_ATRASADO','TURNO_DIA','TURNO_D1'].includes(a.tipo)).length;

      <div class="kpi card-soft" style="border-left:3px solid #f59e0b;"><div class="kpi-icon">🛒</div><small>Solicitações novas</small><strong style="color:#b45309;">${solN}</strong></div>
      <div class="kpi card-soft" style="border-left:3px solid #ef4444;"><div class="kpi-icon">📅</div><small>Agendamentos / avisos</small><strong style="color:#b91c1c;">${turnoN}</strong></div>

function alertaCardHTML(a){
  const leftBg = a.color || '#f59e0b';
  return `<div class="turno-mini alert-card" style="grid-template-columns:92px 1fr auto;align-items:start;border-left-color:${leftBg};">
    <div class="time-pill" style="background:${leftBg}18;color:${leftBg};">
      <div style="font-size:18px;line-height:1;">${a.icon}</div>
      <div>${eh(a.label)}</div>
      ${a.badge?`<div style="font-size:10px;font-weight:900;margin-top:2px;">${eh(a.badge)}</div>`:''}
    </div>
    <div>
      <strong style="font-size:14px;">${eh(a.titulo)}</strong>
      <div style="font-size:12px;color:var(--muted);">${eh(a.subtitulo)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;">${eh(a.detalle)}</div>
    </div>
    <div class="d-flex gap-1 flex-wrap justify-content-end">
      ${alertaActionsHTML(a)}
    </div>
  </div>`;
}
function alertaActionsHTML(a){
  if(a.tipo==='SOL_NUEVA' || a.tipo==='SOL_SEGUIMIENTO'){
    return `
      <button class="btn-navy" onclick="abrirSolDetalle('${a.id}')">Gerenciar</button>
      <button class="btn-soft" onclick="solWhatsApp('${a.id}')">📲 WhatsApp</button>
      ${a.tipo==='SOL_NUEVA'?`<button class="btn-soft" onclick="cambiarEstadoSol('${a.id}','Contactada')">Marcar como contatada</button>`:''}
    `;
  }
  if(a.tipo==='TURNO_DIA' || a.tipo==='TURNO_D1'){
    const tipo = a.tipo==='TURNO_D1' ? 'D1' : 'DIA';
    return `
      <button class="btn-soft" onclick="abrirAlertaWhatsApp('${a.id}','${tipo}')">📲 Abrir WhatsApp</button>
      <button class="btn-navy" onclick="marcarAlertaEnviada('${a.id}','${tipo}')">✓ Marcar como enviada</button>
      <button class="btn-icon" onclick="openTurnoModal('${a.id}')">Ver agendamento</button>
    `;
  }
  if(a.tipo==='PAGO_PENDIENTE' || a.tipo==='REALIZADO_SIN_PAGO'){
    return `
      <button class="btn-soft" onclick="sendPago('${a.id}')">💳 Enviar pagamento</button>
      <button class="btn-navy" onclick="marcarPagado('${a.id}')">✓ Marcar como pago</button>
      <button class="btn-icon" onclick="openTurnoModal('${a.id}')">Ver agendamento</button>
    `;
  }
  if(a.tipo==='TURNO_ATRASADO'){
    return `
      <button class="btn-navy" onclick="openTurnoModal('${a.id}')">Resolver agendamento</button>
      <button class="btn-soft" onclick="switchView('agenda')">Ver agenda</button>
    `;
  }
  if(a.tipo==='PROF_SIN_DISP'){
    return `
      <button class="btn-navy" onclick="switchView('config'); setTimeout(openDisponibilidadModal,350);">Carregar horários</button>
      <button class="btn-soft" onclick="switchView('profesionales')">Ver profissional</button>
    `;
  }
  if(a.tipo==='SERVICIO_INCOMPLETO'){
    return `<button class="btn-navy" onclick="switchView('config')">Revisar serviços</button>`;
  }
  return `<button class="btn-soft" onclick="manualRefresh()">Atualizar</button>`;
}
function abrirAlertaWhatsApp(turnoId,tipo){
  gsRun('apiBuildAlertaWhatsAppLink',[turnoId,tipo,App.session],res=>{
    if(!res.ok) return toast(res.message,'error');
    window.open(res.data,'_blank');
    toast('WhatsApp aberto. Ao enviar, marque o alerta como enviado.');
  });
}
function marcarAlertaEnviada(turnoId,tipo){
  gsRun('apiMarcarAlertaEnviada',[turnoId,tipo,App.session],res=>{
    if(!res.ok) return toast(res.message,'error');
    const idx = App.data.turnos.findIndex(t=>t.id===turnoId);
    if(idx>=0){
      if(tipo==='D1') App.data.turnos[idx].alerta_d1_enviada='SI';
      else App.data.turnos[idx].alerta_dia_enviada='SI';
    }
    toast('Alerta marcada como enviada.');
    renderAlertas();
    if(App.view==='dashboard') renderDashboard();
    revalidate(true);
  });
}

  const root = el('view-profesionales');
  if(App.session.rol!=='Admin'){ root.innerHTML=`<div class="panel card-soft">Sem permissão.</div>`; return; }
  const list = (App.data.usuarios||[]).filter(u=>u.rol==='Staff');
  root.innerHTML = `

        <div>
          <h3 style="margin:0;color:var(--navy);">🧑‍💼 Profissionais / Equipe</h3>
          <p style="font-size:13px;color:var(--muted);margin:4px 0 0;">Profissionais são usuários com perfil Equipe (Staff). Somente eles aparecem na disponibilidade de horários e na agenda.</p>
        </div>
        <button class="btn-navy" onclick="openProfesionalModal()">+ Novo profissional</button>
      </div>
      ${list.length ? `<div class="table-soft"><table class="table table-hover align-middle"><thead><tr><th>Nome</th><th>E-mail</th><th>Unidade</th><th>Especialidade</th><th>Status</th><th></th></tr></thead><tbody>${list.map(profesionalRowHTML).join('')}</tbody></table></div>` : `<div class="empty-state">Nenhum profissional cadastrado. Crie um para poder definir a disponibilidade de horários.</div>`}

}
function profesionalRowHTML(u){
  const suc = byId(App.data.sucursales, u.sucursal_id);
  return `<tr>
    <td><strong>${eh(u.nombre)}</strong></td>
    <td>${eh(u.email)}</td>
    <td>${eh(suc.nombre||'')}</td>
    <td>${eh(u.especialidad||'')}</td>
    <td><span class="status ${u.estado==='Activo'?'st-Realizado':'st-Cancelado'}">${eh(tpal(u.estado||'Activo'))}</span></td>
    <td class="text-end"><button class="btn-icon" onclick="openProfesionalModal('${u.id}')">✏️</button> <button class="btn-danger" onclick="desactivarProfesional('${u.id}')">Desativar</button></td>
  </tr>`;
}
function openProfesionalModal(id=''){
  const u = id ? byId(App.data.usuarios,id) : {estado:'Activo', rol:'Staff'};
  const sucOpts = App.data.sucursales.map(s=>`<option value="${s.id}"${s.id===u.sucursal_id?' selected':''}>${eh(s.nombre)}</option>`).join('');
  openModal(id?'Editar profissional':'Novo profissional',`
    <form id="profForm">
      <input type="hidden" name="id" value="${eh(u.id||'')}">
      <input type="hidden" name="rol" value="Staff">
      <div class="row g-2">
        <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nombre" value="${eh(u.nombre||'')}" required></div>
        <div class="col-md-6"><label class="form-label">E-mail/login</label><input class="form-control" type="email" name="email" value="${eh(u.email||'')}" required></div>
        <div class="col-md-6"><label class="form-label">Senha ${id?'(apenas se alterar)':''}</label><input class="form-control" type="password" name="password" autocomplete="new-password" ${id?'':'required'}></div>
        <div class="col-md-6"><label class="form-label">Unidade</label><select class="form-select" name="sucursal_id"><option value="">Sem unidade</option>${sucOpts}</select></div>
        <div class="col-md-6"><label class="form-label">Especialidade</label><input class="form-control" name="especialidad" value="${eh(u.especialidad||'')}"></div>
        <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="estado"><option value="Activo" ${u.estado==='Activo'?'selected':''}>Ativo</option><option value="Inactivo" ${u.estado==='Inactivo'?'selected':''}>Inativo</option></select></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;">Este usuário aparecerá na Disponibilidade apenas com perfil <strong>Equipe (Staff)</strong> e status <strong>Ativo</strong>.</div>
      <div class="d-flex justify-content-end gap-2 mt-4"><button type="button" class="btn-soft" onclick="closeModal()">Cancelar</button><button class="btn-navy" type="submit">💾 Salvar</button></div>
    </form>`);
  el('profForm').onsubmit=e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    if(!data.password) delete data.password;
    gsRun('apiSaveUsuario',[data,App.session],res=>{
      if(!res.ok) return toast(res.message,'error');
      closeModal(); toast('Profissional salvo.');
      const idx = App.data.usuarios.findIndex(x=>x.id===res.data.id);
      if(idx>=0) App.data.usuarios[idx]=res.data; else App.data.usuarios.push(res.data);
      renderProfesionales(); revalidate(true);
    });
  };
}
function desactivarProfesional(id){
  confirmX('Desativar este profissional? O histórico de agendamentos não será apagado.',()=>{
    gsRun('apiDeleteUsuario',[id,App.session],res=>{
      if(!res.ok) return toast(res.message,'error');
      const idx=App.data.usuarios.findIndex(u=>u.id===id);
      if(idx>=0) App.data.usuarios[idx].estado='Inactivo';
      toast('Profissional desativado.'); renderProfesionales(); revalidate(true);
    });
  });
}

      <canvas id="chartProfes" height="100"></canvas>

        <thead><tr><th>Profissional</th><th>Agendamentos</th><th>Realizados</th><th>Estimativa (${moneda()})</th></tr></thead>

          ${profs.map(p=>{
            const ts=turnos.filter(t=>t.profesional_id===p.id);

            const rec=real.reduce((s,t)=>s+Number(byId(App.data.servicios,t.servicio_id).precio||0),0);
            return `<tr><td><strong>${eh(p.nombre)}</strong></td><td>${ts.length}</td><td>${real.length}</td><td>${formatMoney(rec)}</td></tr>`;
          }).join('')}

async function renderCharts() {
  if (typeof Chart==='undefined') {
    App.chartPromise ||= new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js';
      s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o Chart.js'));
      document.head.appendChild(s);
    });
    try { await App.chartPromise; } catch(e) { toast(e.message,'error'); return; }
  }
  // Destruir charts previos
  Object.values(App.charts).forEach(c=>c?.destroy&&c.destroy());
  App.charts={};

  const turnos = App.data.turnos;
  const est = ['Pendiente','Confirmado','Realizado','Cancelado','Reprogramado','Ausente'];

  const c1=el('chartEstados'), c2=el('chartServicios'), c3=el('chartProfes');
  if (!c1||!c2||!c3) return;

  App.charts.estados = new Chart(c1,{type:'doughnut',data:{
    labels:est.map(v=>tpal(v)),
    datasets:[{data:est.map(e=>turnos.filter(t=>t.estado===e).length),
      backgroundColor:['#ffe3ad','#a7f3d0','#10b981','#ffcdd6','#c4b5fd','#e2e8f0'],borderWidth:0}]
  },options:{responsive:true,plugins:{legend:{position:'bottom'}}}});

  App.charts.servicios = new Chart(c2,{type:'bar',data:{
    labels:App.data.servicios.map(s=>s.nombre),
    datasets:[{label:'Agendamentos',data:App.data.servicios.map(s=>turnos.filter(t=>t.servicio_id===s.id).length),
      backgroundColor:App.data.servicios.map(s=>s.color_hex||'#10b981'),borderRadius:6}]
  },options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

  const profs=profesionales();
  App.charts.profes = new Chart(c3,{type:'bar',data:{
    labels:profs.map(p=>p.nombre),
    datasets:[{label:'Agendamentos atribuídos',data:profs.map(p=>turnos.filter(t=>t.profesional_id===p.id).length),
      backgroundColor:'#16a34a',borderRadius:6}]
  },options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}});
}

function renderSolicitudes() {
  const root = el('view-solicitudes');
  if (!['Admin','Recepcionista'].includes(App.session.rol)) {
    root.innerHTML=`<div class="panel card-soft">Sem permissão.</div>`; return;
  }

  const sols = (App.data.solicitudes||[]).slice().sort((a,b)=>b.fecha_solicitud.localeCompare(a.fecha_solicitud));
  const counts = { Nueva:0, Contactada:0, Confirmada:0, Cancelada:0 };
  sols.forEach(s => { if (counts[s.estado]!==undefined) counts[s.estado]++; });

  root.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:20px;">
      <div class="kpi card-soft"><div class="kpi-icon">🛒</div><small>Novas</small><strong style="color:#b45309;">${counts.Nueva}</strong></div>
      <div class="kpi card-soft"><div class="kpi-icon">📞</div><small>Contatadas</small><strong>${counts.Contactada}</strong></div>
      <div class="kpi card-soft"><div class="kpi-icon">✅</div><small>Confirmadas</small><strong style="color:#065f46;">${counts.Confirmada}</strong></div>
      <div class="kpi card-soft"><div class="kpi-icon">❌</div><small>Canceladas</small><strong style="color:#9f1239;">${counts.Cancelada}</strong></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex gap-2 flex-wrap" id="solFiltros">
        ${['Todas','Nueva','Contactada','Confirmada','Cancelada'].map(f=>
          `<button class="btn-soft" style="${f==='Todas'?'background:var(--navy);color:#fff;':''}" onclick="filtrarSolicitudes('${f}',this)">${f==='Todas'?'Todas':tpal(f)}</button>`
        ).join('')}
      </div>
      <button class="btn-soft" onclick="manualRefresh()">↻ Atualizar dados</button>
    </div>

    <div id="solList">
      ${sols.length ? sols.map(solCardHTML).join('') : `<div class="panel card-soft" style="text-align:center;color:var(--muted);">Nenhuma solicitação ainda. Compartilhe o link do portal público.</div>`}
    </div>`;
}

function solCardHTML(s) {
  const svcTags = (s.servicios_nombres||'').split('|').filter(Boolean)
    .map(n=>`<span class="sol-servicios-tag">${eh(n)}</span>`).join('');
  return `
  <div class="sol-card ${eh(s.estado)}" id="sol-${s.id}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong style="font-size:15px;">${eh(s.nombre_cliente)}</strong>
          <span class="sol-estado sol-${eh(s.estado)}">${eh(tpal(s.estado))}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px;">
          📞 ${eh(s.telefono_cliente)} · ✉️ ${eh(s.email_cliente)}
          <span style="margin-left:8px;opacity:.6;">${eh(s.fecha_solicitud)}</span>
        </div>
        <div style="margin-top:8px;">${svcTags}</div>
        ${s.nota_cliente?`<div style="margin-top:6px;font-size:12px;color:var(--muted);">📝 ${eh(s.nota_cliente)}</div>`:''}
        ${s.nota_interna?`<div style="margin-top:4px;font-size:12px;background:#fef9ec;color:#92400e;padding:4px 8px;border-radius:8px;">🔒 ${eh(s.nota_interna)}</div>`:''}
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:20px;font-weight:800;color:var(--navy);">${moneda()} ${Number(s.total).toLocaleString('pt-BR')}</div>
        <div style="font-size:11px;color:var(--muted);">Total estimado</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
      <button class="btn-soft" style="font-size:12px;" onclick="abrirSolDetalle('${s.id}')">📋 Gerenciar</button>
      ${s.telefono_cliente?`<button class="btn-soft" style="font-size:12px;" onclick="solWhatsApp('${s.id}')">📲 WhatsApp</button>`:''}
      ${s.telefono_cliente?`<button class="btn-soft" style="font-size:12px;background:#25d366;color:#fff;border-color:#25d366;" onclick="solEnviarPago('${s.id}')">💳 Cobrar</button>`:''}
      <button class="btn-soft" style="font-size:12px;" onclick="cambiarEstadoSol('${s.id}','Contactada')">📞 Contactada</button>
      <button class="btn-soft" style="font-size:12px;" onclick="cambiarEstadoSol('${s.id}','Confirmada')">✅ Confirmar</button>
    </div>
  </div>`;
}

function filtrarSolicitudes(filtro, btn) {
  document.querySelectorAll('#solFiltros button').forEach(b=>{
    b.style.background=''; b.style.color='';
  });
  btn.style.background='var(--navy)'; btn.style.color='#fff';

  const all = App.data.solicitudes||[];
  const list = filtro==='Todas' ? all : all.filter(s=>s.estado===filtro);
  el('solList').innerHTML = list.length
    ? list.map(solCardHTML).join('')
    : `<div class="panel card-soft" style="text-align:center;color:var(--muted);">Nenhuma solicitação com esse status.</div>`;
}

function abrirSolDetalle(id) {
  const s = (App.data.solicitudes||[]).find(x=>x.id===id); if (!s) return;
  const svcTags = (s.servicios_nombres||'').split('|').filter(Boolean).map(n=>`<span class="sol-servicios-tag">${eh(n)}</span>`).join('');

  openModal('Solicitação — '+eh(s.nombre_cliente),`
    <div class="row g-3">
      <div class="col-md-6">
        <p><b>Cliente:</b> ${eh(s.nombre_cliente)}</p>
        <p><b>Tel:</b> ${eh(s.telefono_cliente)}</p>
        <p><b>E-mail:</b> ${eh(s.email_cliente)}</p>
        <p><b>Data:</b> ${eh(s.fecha_solicitud)}</p>
      </div>
      <div class="col-md-6">
        <div style="background:#f0f9ff;border-radius:12px;padding:14px;text-align:center;">
          <div style="font-size:11px;color:var(--muted);">Total estimado</div>
          <div style="font-size:24px;font-weight:800;color:var(--navy);">${moneda()} ${Number(s.total).toLocaleString('pt-BR')}</div>
        </div>
      </div>
      <div class="col-12"><div style="margin-top:4px;">${svcTags}</div></div>
      ${s.nota_cliente?`<div class="col-12"><p style="font-size:13px;color:var(--muted);">📝 Observação do cliente: ${eh(s.nota_cliente)}</p></div>`:''}
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select" id="solEstadoSel">
          ${['Nueva','Contactada','Confirmada','Cancelada'].map(e=>`<option value="${e}"${e===s.estado?' selected':''}>${tpal(e)}</option>`).join('')}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nota interna</label>
        <input class="form-control" id="solNotaInterna" value="${eh(s.nota_interna||'')}">
      </div>
    </div>
    <div class="d-flex gap-2 flex-wrap justify-content-between mt-4">
      <div class="d-flex gap-2 flex-wrap">
        ${s.telefono_cliente?`<button class="btn-soft" onclick="solWhatsApp('${s.id}')">📲 WhatsApp</button>`:''}
        ${s.telefono_cliente?`<button class="btn-soft" style="background:#25d366;color:#fff;border-color:#25d366;" onclick="solEnviarPago('${s.id}')">💳 Enviar cobrança</button>`:''}
      </div>
      <div class="d-flex gap-2">
        <button class="btn-soft" onclick="closeModal()">Fechar</button>
        <button class="btn-navy" onclick="guardarSolEstado('${s.id}')">💾 Salvar</button>
      </div>
    </div>`);
}

function guardarSolEstado(id) {
  const estado = el('solEstadoSel').value;
  const nota   = el('solNotaInterna').value;
  gsRun('apiUpdateSolicitudEstado',[id,estado,nota,App.session], res=>{
    if (!res.ok) return toast(res.message,'error');
    closeModal(); toast('Solicitação atualizada.');
    const s = (App.data.solicitudes||[]).find(x=>x.id===id);
    if (s) { s.estado=estado; s.nota_interna=nota; }
    renderSolicitudes(); updateAlertBadge(); if(App.view==='alertas') renderAlertas();
  });
}

function cambiarEstadoSol(id, estado) {
  gsRun('apiUpdateSolicitudEstado',[id,estado,'',App.session], res=>{
    if (!res.ok) return toast(res.message,'error');
    const s = (App.data.solicitudes||[]).find(x=>x.id===id);
    if (s) s.estado=estado;
    toast('Status: '+tpal(estado));
    renderSolicitudes(); updateAlertBadge(); if(App.view==='alertas') renderAlertas();
  });
}

function solWhatsApp(id) {
  const s = (App.data.solicitudes||[]).find(x=>x.id===id); if (!s) return;
  const phone = s.telefono_cliente.replace(/[^\d]/g,'');
  if (!phone) return toast('Sem telefone.','error');
  const empresa = getSetting('Nombre_Empresa')||'EO Solução & Criação';
  const msg = `Olá ${s.nombre_cliente} 👋, somos da *${empresa}*. ` +
    `Recebemos sua solicitação de serviços no valor de ${moneda()} ${Number(s.total).toLocaleString('pt-BR')}. ` +
    `Entraremos em contato para coordenar seu agendamento. Quando você tem disponibilidade?`;
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

function solEnviarPago(id) {
  const s = (App.data.solicitudes||[]).find(x=>x.id===id); if (!s) return;
  const phone = s.telefono_cliente.replace(/[^\d]/g,'');
  if (!phone) return toast('Sem telefone.','error');

  const hasPago = getSetting('Pago_CBU')||getSetting('Pago_Alias')||getSetting('Pago_MP')||getSetting('Pago_Otro_Link');
  if (!hasPago) { toast('Configure métodos de pagamento em ⚙️ Configurações.','error'); return; }

  const metodos = [];
  if (getSetting('Pago_CBU'))   metodos.push(`🏦 *Chave Pix:* ${getSetting('Pago_CBU')}`);
  if (getSetting('Pago_Alias')) metodos.push(`🏦 *Alias:* ${getSetting('Pago_Alias')}`);
  if (getSetting('Pago_MP'))    metodos.push(`💙 *Mercado Pago:* ${getSetting('Pago_MP')}`);
  if (getSetting('Pago_Otro_Nombre')&&getSetting('Pago_Otro_Link')) {
    metodos.push(`💳 *${getSetting('Pago_Otro_Nombre')}:* ${getSetting('Pago_Otro_Link')}`);
  }

  const tpl = getSetting('Plantilla_Pago') ||
    'Olá {{cliente}} 👋\n\nEnviamos os detalhes para pagamento:\n\n🛎 *Serviços:* {{servicio}}\n💰 *Valor:* {{moneda}} {{monto}}\n\n{{metodos_pago}}\n\nObrigado!';

  const msg = tpl
    .replace(/\{\{cliente\}\}/g, s.nombre_cliente)
    .replace(/\{\{servicio\}\}/g, s.servicios_nombres.replace(/\|/g,', '))
    .replace(/\{\{monto\}\}/g, Number(s.total).toLocaleString('pt-BR'))
    .replace(/\{\{moneda\}\}/g, moneda())
    .replace(/\{\{metodos_pago\}\}/g, metodos.join('\n'));

  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

/* ─────────────────────────────────────────────────────────────────────── */

/* ════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════ */
function diaNombre(n) {
  return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][Number(n)]||n;
}

function previewPago() {
  const c = el('pagoPreviewCards'); if (!c) return;

  // Leer valores actuales del formulario si existe, sino desde ajustes
  const v = id => {
    const inp = document.querySelector(`#pagosForm [name="${id}"]`);
    return inp ? inp.value : getSetting(id);
  };

  const metodos = [
    { icon:'🏦', label:'Chave Pix',      val:v('Pago_CBU'),   show:!!v('Pago_CBU') },
    { icon:'🏦', label:'Alias',          val:v('Pago_Alias'), show:!!v('Pago_Alias') },
    { icon:'💙', label:'Mercado Pago',   val:v('Pago_MP'),    show:!!v('Pago_MP') },
    { icon:'💳', label:v('Pago_Otro_Nombre')||'Outra carteira', val:v('Pago_Otro_Link'), show:!!v('Pago_Otro_Link') }
  ].filter(m=>m.show);

  if (!metodos.length) {
    c.innerHTML=`<div style="background:#fff9ec;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:13px;color:#92400e;">
      ⚠️ Nenhum método de pagamento configurado. Preencha pelo menos um dos campos abaixo.</div>`;
    return;
  }

  c.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
    ${metodos.map(m=>`<div class="pago-metodo-row" style="flex:1;min-width:200px;">
      <div class="pago-metodo-icon">${m.icon}</div>
      <div><div class="pago-metodo-label">${eh(m.label)}</div><div class="pago-metodo-val">${eh(m.val)}</div></div>
    </div>`).join('')}
  </div>
  <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;font-size:12px;color:#065f46;margin-top:4px;">
    ✅ ${metodos.length} método${metodos.length>1?'s':''} ativo${metodos.length>1?'s':''}. Ao pressionar "Enviar pagamento", será gerada uma mensagem de WhatsApp com todos esses dados.
  </div>`;
}

/* ════════════════════════════════════════════════════
   LOGOUT
════════════════════════════════════════════════════ */
function logout() {
  try { if (App.session) gsRun('apiLogout',[App.session],()=>{},()=>{}); } catch(e){}
  localStorage.removeItem(KEYS.session);
  localStorage.removeItem(KEYS.bootstrap);
  localStorage.removeItem(KEYS.etags);
  App.session=null; App.view='dashboard';
  el('app').classList.add('hidden');
  el('loginScreen').classList.remove('hidden');
  el('loginEmail').value=''; el('loginPassword').value='';
  el('modalRoot').innerHTML='';
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='dashboard'));
  document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
  el('view-dashboard').classList.remove('hidden');
  toast('Sessão encerrada.');
}

function telegramDetectChat(){
  const form = el('telegramForm');
  if (!form) return;
  const obj = Object.fromEntries(new FormData(form).entries());
  saveAjustes(obj,'Dados do Telegram salvos. Procurando chat...',()=>{
    gsRun('apiTelegramDetectChatId',[App.session],r=>{
      if (!r.ok) return toast(r.message,'error');
      const chatId = r.data.chat_id;
      const inp = el('telegramChatId');
      if (inp) inp.value = chatId;
      const row = App.data.ajustes.find(a=>a.clave==='Telegram_Chat_ID');
      if (row) row.valor=chatId; else App.data.ajustes.push({clave:'Telegram_Chat_ID',valor:chatId});
      toast('Chat detectado: '+chatId);
    },err=>toast(err.message,'error'));
  });
}

function telegramTest(){
  const form = el('telegramForm');
  if (!form) return;
  const obj = Object.fromEntries(new FormData(form).entries());
  saveAjustes(obj,null,()=>{
    gsRun('apiTelegramTest',[App.session],r=>{
      if (!r.ok) return toast(r.message,'error');
      toast('Mensagem de teste enviada ao Telegram.');
    },err=>toast(err.message,'error'));
  });
}

function telegramRunNow(){
  gsRun('apiRunTelegramAlertasRealtime',[App.session],r=>{
    if(!r.ok) return toast(r.message,'error');
    const d = r.data || {};
    toast(`Telegram verificado: ${d.enviados||0} enviados, ${d.omitidos||0} já enviados, ${d.errores||0} erros.`);
  },err=>toast(err.message,'error'));
}

</script>
